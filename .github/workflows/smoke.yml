name: Smoke test

# Opens every page, tab and sub-view at phone, tablet and desktop width (tests/smoke.html) and fails
# on script errors, empty views, stray "undefined"/"NaN" text, or clipped content. GitHub Pages
# publishes from the branch regardless, so a red check means "fix this soon", not "blocked".
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The checks only read the repository, so the job's token gets read access and nothing else.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The committed data files have to pass the same checks the weekly refresh runs (the box-score
      # reconciliation needs the sibling projects, so it is skipped here with a warning).
      - run: python scripts/validate_data.py
      # every script and stylesheet address in the pages must carry the hash of its current content
      - run: python scripts/stamp_assets.py --check
      - run: pip install playwright axe-playwright-python
      - run: playwright install --with-deps chromium
      - run: python tests/run_smoke.py
      # accessibility: the axe engine on every page and tab, light and dark
      - run: python tests/run_axe.py
