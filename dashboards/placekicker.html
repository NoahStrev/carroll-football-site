<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placekicker — Carroll Football Analytics</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  /* .unit-header, .kpirow/.kpirow-5/.kpirow-6, .colcard-2/.kicker-col/
     .kicker-head/.kicker-select/.kicker-body/.mini-kpi-row, .heat, .barchart
     all already live in css/theme.css (carried from the mockups, or hoisted
     2026-08-01) -- only page-specific layout goes here. */
</style>
</head>
<body>

<div class="page">
  <nav class="sitenav">
    <div class="brand"><span class="mark">CU</span> Carroll Football Analytics</div>
    <div class="links">
      <a href="special-teams-overview.html">Special Teams</a>
      <a href="placekicker.html" class="active">Positions</a>
      <a href="lifting-strength.html">Lifting &amp; Strength</a>
      <a href="offense.html">Offense</a>
      <a href="defense.html">Defense</a>
      <a href="opponent-scouting.html">Opponent Scouting</a>
      <a href="rankings.html">Rankings</a>
      <a href="glossary.html">Glossary</a>
      <a href="updates.html">Updates</a>
    </div>
  </nav>

  <div class="intro">
    <h1>Placekicker</h1>
  </div>

  <div class="subnav-label">Positions</div>
  <div class="tabbar" id="position-subnav">
    <a class="tabbtn" href="special-teams-overview.html">Overview</a>
    <a class="tabbtn active" href="placekicker.html">Placekicker</a>
    <a class="tabbtn" href="kickoff-kicker.html">Kickoff Kicker</a>
    <a class="tabbtn" href="punter.html">Punter</a>
    <a class="tabbtn" href="short-snapper.html">Short Snapper</a>
    <a class="tabbtn" href="long-snapper.html">Long Snapper</a>
  </div>

  <div class="tabbar" id="pk-tabs">
    <button class="tabbtn active" data-tab="exec">Executive Scorecard</button>
    <button class="tabbtn" data-tab="h2h">Kicker Head-to-Head</button>
    <button class="tabbtn" data-tab="deep">Situational Deep Dive</button>
  </div>

  <div class="stage" id="pk-stage"></div>
</div>

<script src="../js/charts.js"></script>
<script>
let DATA = null;
/* FG_DIST_BUCKETS/fgDistBucket (shared with special-teams-overview.html) and
   fgs/pats/makes/makeRate (shared with Short Snapper) now live in js/charts.js. */

/* ------------------------------------------------------------------ tab: Executive Scorecard --- */

const EXEC_FILTERS = [
  { field: 'season', label: 'Season', defaultLatestOnly: true },
  { field: 'kicker', label: 'Kicker' },
];

function execTab(root) {
  root.innerHTML = `
    <div class="frame-wrap active"><div class="slide">
      <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Placekicker</h2></div><div class="sub">Executive Scorecard</div></div>
      <div class="shelf" id="pke-shelf"></div>
      <div class="body">
        <div class="kpirow-5" id="pke-kpis">
          ${kpiHTML('pke-pat', 'PAT Make Rate', '--good')}
          ${kpiHTML('pke-fg', 'FG Make Rate', '--critical')}
          ${kpiHTML('pke-long', 'Longest FG Made')}
          ${kpiHTML('pke-n', 'Kicks in View')}
          ${kpiHTML('pke-score', 'Avg PAT/FG Score', undefined, 'Value / Score')}
        </div>
        <div class="grid2">
          <div class="card"><div class="card-head"><h3>FG Make % by Season</h3></div><div class="card-body" id="pke-season"></div></div>
          <div class="card"><div class="card-head"><h3>FG Make % by Distance Bucket</h3></div><div class="card-body" id="pke-dist"></div></div>
        </div>
      </div>
      <div class="footer-note">Source: Carroll PAT-FG sheet, Carroll_Special_Teams_2021_Current.xlsx (236 rows).</div>
    </div></div>`;

  document.getElementById('pke-shelf').innerHTML = buildFilterPanel('pke', EXEC_FILTERS, DATA.filters.money_unit);
  wireFilterPanel('pke', EXEC_FILTERS, render);

  function render() {
    const state = readFilterState('pke', EXEC_FILTERS);
    const rows = applyFilters(DATA.units.money_unit, state);
    document.getElementById('pke-summary').textContent = `${rows.length} kicks in view`;

    const fgRows = fgs(rows), patRows = pats(rows);
    const fgMade = makes(fgRows);
    setKPI('pke-pat', pct(makeRate(patRows)), `${makes(patRows).length}/${patRows.length} PATs`);
    setKPI('pke-fg', pct(makeRate(fgRows)), `${fgMade.length}/${fgRows.length} field goals`);
    setKPI('pke-long', fgMade.length ? `${Math.max(...fgMade.map((r) => r.distance))} yds` : '—');
    setKPI('pke-n', String(rows.length));
    setKPI('pke-score', fmt(mean(rows.map((r) => r.score)), 0));

    const seasons = DATA.filters.money_unit.season.filter((s) => rows.some((r) => r.season === s));
    const byseason = groupBy(fgRows, 'season');
    renderBar(document.getElementById('pke-season'), {
      categories: seasons,
      values: seasons.map((s) => { const g = byseason.get(s); return g && g.length ? makeRate(g) : null; }),
      labelFmt: (v) => pct(v, 0),
      colorFn: () => cssVar('--cat-1'),
      tooltipExtra: (s) => `${(byseason.get(s) || []).length} kicks`,
    });

    const byBucket = groupBy(fgRows.map((r) => ({ ...r, _b: fgDistBucket(r.distance) })), '_b');
    renderBar(document.getElementById('pke-dist'), {
      categories: FG_DIST_BUCKETS,
      values: FG_DIST_BUCKETS.map((b) => { const g = byBucket.get(b); return g && g.length ? makeRate(g) : null; }),
      labelFmt: (v) => pct(v, 0),
      colorFn: () => cssVar('--cat-3'),
      tooltipExtra: (b) => `${(byBucket.get(b) || []).length} kicks`,
    });
  }
  render();
}

/* ------------------------------------------------------------------ tab: Kicker Head-to-Head --- */

const H2H_FILTERS = [{ field: 'season', label: 'Season', defaultLatestOnly: true }];

/* initials() now lives in js/charts.js -- shared across position pages. */

function h2hTab(root) {
  const kickers = DATA.filters.money_unit.kicker;
  root.innerHTML = `
    <div class="frame-wrap active"><div class="slide">
      <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Placekicker</h2></div><div class="sub">Kicker Head-to-Head</div></div>
      <div class="shelf" id="pkh-shelf"></div>
      <div class="body">
        <div class="colcard-2" style="margin-bottom:14px;">
          <div class="kicker-col">
            <div class="kicker-head">
              <div class="avatar" id="pkh-A-avatar" style="background:var(--cat-6);"></div>
              <div style="flex:1; min-width:0;"><div id="pkh-A-sel"></div><div class="yrs" id="pkh-A-years"></div></div>
            </div>
            <div class="kicker-body">
              <div class="mini-kpi-row">
                <div class="mini-kpi"><div class="l">PAT%</div><div class="v" id="pkh-A-pat">—</div></div>
                <div class="mini-kpi"><div class="l">FG%</div><div class="v" id="pkh-A-fg">—</div></div>
                <div class="mini-kpi"><div class="l">Long</div><div class="v" id="pkh-A-long">—</div></div>
                <div class="mini-kpi"><div class="l">Avg Score</div><div class="v" id="pkh-A-score">—</div></div>
              </div>
              <div class="card-head" style="padding:0 0 6px; border:none;"><h3>FG makes by distance</h3></div>
              <div id="pkh-A-distchart"></div>
            </div>
          </div>
          <div class="kicker-col">
            <div class="kicker-head">
              <div class="avatar" id="pkh-B-avatar" style="background:var(--cat-3);"></div>
              <div style="flex:1; min-width:0;"><div id="pkh-B-sel"></div><div class="yrs" id="pkh-B-years"></div></div>
            </div>
            <div class="kicker-body">
              <div class="mini-kpi-row">
                <div class="mini-kpi"><div class="l">PAT%</div><div class="v" id="pkh-B-pat">—</div></div>
                <div class="mini-kpi"><div class="l">FG%</div><div class="v" id="pkh-B-fg">—</div></div>
                <div class="mini-kpi"><div class="l">Long</div><div class="v" id="pkh-B-long">—</div></div>
                <div class="mini-kpi"><div class="l">Avg Score</div><div class="v" id="pkh-B-score">—</div></div>
              </div>
              <div class="card-head" style="padding:0 0 6px; border:none;"><h3>FG makes by distance</h3></div>
              <div id="pkh-B-distchart"></div>
            </div>
          </div>
        </div>
        <div class="card" style="margin-bottom:14px;">
          <div class="card-head"><h3>FG make % by season — selected kickers</h3></div>
          <div class="card-body">
            <div class="legend" id="pkh-trend-legend"></div>
            <div id="pkh-trend-chart"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Operation time build-up, snap → kick</h3></div>
          <div class="card-body">
            <div class="legend">
              <span class="sw"><span class="dot" style="background:var(--cat-1);"></span>Snap → catch</span>
              <span class="sw"><span class="dot" style="background:var(--cat-4);"></span>Catch → kick</span>
            </div>
            <div class="stacked" style="height:120px;">
              <div class="gridlines"><div></div><div></div><div></div></div>
              <div id="pkh-optime-chart" style="display:contents;"></div>
            </div>
            <div class="data-note">Only charted 2023 onward — bars use whichever of the selected kickers' rows actually have Snap to Catch/Catch to Kick logged, never padded with blanks for 2021–2022.</div>
          </div>
        </div>
      </div>
      <div class="footer-note">Source: Carroll PAT-FG sheet, Carroll_Special_Teams_2021_Current.xlsx.</div>
    </div></div>`;

  document.getElementById('pkh-shelf').innerHTML = buildFilterPanel('pkh', H2H_FILTERS, DATA.filters.money_unit);
  wireFilterPanel('pkh', H2H_FILTERS, render);

  const selA = makeSearchCombobox(document.getElementById('pkh-A-sel'), {
    options: kickers.map((k) => ({ value: k, label: k })), value: kickers[0], onChange: render, placeholder: 'Search kicker…',
  });
  const selB = makeSearchCombobox(document.getElementById('pkh-B-sel'), {
    options: kickers.map((k) => ({ value: k, label: k })), value: kickers[1] || kickers[0], onChange: render, placeholder: 'Search kicker…',
  });

  function renderSide(prefix, kicker, rows) {
    document.getElementById(`${prefix}-avatar`).textContent = initials(kicker);
    const kRows = rows.filter((r) => r.kicker === kicker);
    const seasons = [...new Set(kRows.map((r) => r.season))].sort();
    document.getElementById(`${prefix}-years`).textContent = seasons.length ? (seasons.length === 1 ? seasons[0] : `${seasons[0]} – ${seasons[seasons.length - 1]}`) : 'no attempts in range';
    const kFg = fgs(kRows), kPat = pats(kRows), kFgMade = makes(kFg);
    document.getElementById(`${prefix}-pat`).textContent = pct(makeRate(kPat));
    document.getElementById(`${prefix}-fg`).textContent = pct(makeRate(kFg));
    document.getElementById(`${prefix}-long`).textContent = kFgMade.length ? `${Math.max(...kFgMade.map((r) => r.distance))} yds` : '—';
    document.getElementById(`${prefix}-score`).textContent = fmt(mean(kRows.map((r) => r.score)), 0);
    const byBucket = groupBy(kFg.map((r) => ({ ...r, _b: fgDistBucket(r.distance) })), '_b');
    renderBar(document.getElementById(`${prefix}-distchart`), {
      categories: FG_DIST_BUCKETS,
      values: FG_DIST_BUCKETS.map((b) => (byBucket.get(b) || []).filter((r) => r.make).length),
      labelFmt: (v) => String(v),
      colorFn: () => cssVar('--cat-1'),
      tooltipExtra: (b) => `${(byBucket.get(b) || []).length} kicks`,
      compact: true,
    });
    return kRows;
  }

  function render() {
    const state = readFilterState('pkh', H2H_FILTERS);
    const rows = applyFilters(DATA.units.money_unit, state);
    document.getElementById('pkh-summary').textContent = `${rows.length} kicks in view`;
    const rowsA = renderSide('pkh-A', selA.value, rows);
    const rowsB = renderSide('pkh-B', selB.value, rows);

    document.getElementById('pkh-trend-legend').innerHTML = `
      <span class="sw"><span class="dot" style="background:var(--cat-6)"></span>${selA.value}</span>
      <span class="sw"><span class="dot" style="background:var(--cat-3)"></span>${selB.value}</span>`;

    const seasons = DATA.filters.money_unit.season;
    const sA = seasonSeries(fgs(rowsA), seasons, makeRate);
    const sB = seasonSeries(fgs(rowsB), seasons, makeRate);
    renderGroupedBar(document.getElementById('pkh-trend-chart'), {
      categories: seasons, valuesA: sA.values, valuesB: sB.values, colorA: cssVar('--cat-6'), colorB: cssVar('--cat-3'),
      nameA: selA.value, nameB: selB.value, labelFmt: (v) => pct(v, 0), countsA: sA.counts, countsB: sB.counts,
    });

    const opRows = rows.filter((r) => r.kicker === selA.value || r.kicker === selB.value);
    renderStacked(document.getElementById('pkh-optime-chart'), {
      categories: [selA.value, selB.value],
      series: {
        'Snap → catch': [selA.value, selB.value].map((k) => mean(opRows.filter((r) => r.kicker === k).map((r) => r.snap_to_catch)) || 0),
        'Catch → kick': [selA.value, selB.value].map((k) => mean(opRows.filter((r) => r.kicker === k).map((r) => r.catch_to_kick)) || 0),
      },
      order: ['Snap → catch', 'Catch → kick'],
      colors: { 'Snap → catch': cssVar('--cat-1'), 'Catch → kick': cssVar('--cat-4') },
      legend: false,
    });
  }
  render();
}

/* renderGroupedBar now lives in js/charts.js (hoisted 2026-08-01 -- needed again by
   the Kickoff Kicker page, don't re-add a local copy). */

/* ------------------------------------------------------------------ tab: Situational Deep Dive --- */

const DEEP_FILTERS = [
  { field: 'season', label: 'Season', defaultLatestOnly: true },
  { field: 'kicker', label: 'Kicker' },
  { field: 'quarter', label: 'Quarter' },
  { field: 'is_home', label: 'Home/Away' },
];

function deepTab(root) {
  root.innerHTML = `
    <div class="frame-wrap active"><div class="slide">
      <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Placekicker</h2></div><div class="sub">Situational Deep Dive</div></div>
      <div class="shelf" id="pkd-shelf"></div>
      <div class="body">
        <div class="kpirow" id="pkd-kpis">
          ${kpiHTML('pkd-fg', 'FG Make Rate', '--critical')}
          ${kpiHTML('pkd-blocked', 'Blocked')}
          ${kpiHTML('pkd-homeaway', 'Home vs Away FG%')}
          ${kpiHTML('pkd-bestq', 'Best Quarter')}
        </div>
        <div class="grid2" style="margin-bottom:14px;">
          <div class="card"><div class="card-head"><h3>FG attempts &amp; make % by quarter</h3></div><div class="card-body" id="pkd-quarter"></div></div>
          <div class="card"><div class="card-head"><h3>PAT vs FG attempt volume by season</h3></div><div class="card-body" id="pkd-volume"></div></div>
        </div>
        <div class="card" style="margin-bottom:14px;">
          <div class="card-head"><h3>FG make % — distance bucket × season</h3></div>
          <div class="card-body">
            <div id="pkd-heatmap"></div>
            <div class="insight">Sequential blue = make%. Columns always show all five seasons — only the Kicker and Quarter filters narrow this grid.</div>
          </div>
        </div>
        <div class="grid2" style="margin-bottom:14px;">
          <div class="card"><div class="card-head"><h3>FG make % by hash kicked from</h3></div><div class="card-body" id="pkd-hash"><div class="data-note">Charted 2023 onward only.</div></div></div>
          <div class="card"><div class="card-head"><h3>FG make % by Snap Location</h3></div><div class="card-body" id="pkd-snaploc"><div class="data-note">Charted 2023 onward only. Snap Location is a snap-quality ranking (scale may be 1-3 or 1-5) -- which end means "better" isn't confirmed yet, shown as-is.</div></div></div>
        </div>
        <div class="card" style="margin-bottom:14px;">
          <div class="card-head"><h3>Avg PAT/FG Score by season</h3></div><div class="card-body" id="pkd-scoretrend"></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Kicker &amp; miss-type detail</h3></div>
          <div class="card-body">
            <table class="mini">
              <thead><tr><th>Kicker</th><th>Seasons</th><th>PAT (made/att)</th><th>PAT %</th><th>FG (made/att)</th><th>FG %</th><th>Long</th><th>Avg Score</th><th>Avg Op Time</th></tr></thead>
              <tbody id="pkd-table-body"></tbody>
            </table>
            <div class="insight">Attempts/makes/PAT/FG/Long/Score are real and respect the filters above. Avg Op Time only reflects charted rows (2023 onward) — shows "—" for a kicker with none in view.</div>
          </div>
        </div>
      </div>
      <div class="footer-note">Source: Carroll PAT-FG sheet, Carroll_Special_Teams_2021_Current.xlsx (236 rows).</div>
    </div></div>`;

  document.getElementById('pkd-shelf').innerHTML = buildFilterPanel('pkd', DEEP_FILTERS, DATA.filters.money_unit);
  wireFilterPanel('pkd', DEEP_FILTERS, render);

  function render() {
    const state = readFilterState('pkd', DEEP_FILTERS);
    const rows = applyFilters(DATA.units.money_unit, state);
    document.getElementById('pkd-summary').textContent = `${rows.length} kicks in view`;

    const fgRows = fgs(rows), patRows = pats(rows);
    setKPI('pkd-fg', pct(makeRate(fgRows)), `${makes(fgRows).length}/${fgRows.length} field goals`);
    setKPI('pkd-blocked', String(rows.filter((r) => r.miss_location === 'Blocked').length));
    const homeFg = fgRows.filter((r) => r.is_home), awayFg = fgRows.filter((r) => !r.is_home);
    setKPI('pkd-homeaway', `${pct(makeRate(homeFg), 0)} / ${pct(makeRate(awayFg), 0)}`, 'home / away');
    const byQ = groupBy(fgRows, 'quarter');
    const { key: bestQ, value: bestRate } = bestByGroup(byQ, makeRate);
    setKPI('pkd-bestq', bestQ !== null ? `Q${bestQ}` : '—', bestQ !== null ? `${pct(bestRate, 0)} (n=${byQ.get(bestQ).length})` : 'not enough attempts');

    const quarters = DATA.filters.money_unit.quarter.filter((q) => byQ.has(q));
    renderBar(document.getElementById('pkd-quarter'), {
      categories: quarters,
      values: quarters.map((q) => makeRate(byQ.get(q))),
      labelFmt: (v) => pct(v, 0),
      colorFn: () => cssVar('--cat-2'),
      tooltipExtra: (q) => `${byQ.get(q).length} kicks`,
    });

    const seasons = DATA.filters.money_unit.season.filter((s) => rows.some((r) => r.season === s));
    const patBySeason = groupBy(patRows, 'season'), fgBySeason = groupBy(fgRows, 'season');
    renderStacked(document.getElementById('pkd-volume'), {
      categories: seasons,
      series: {
        PAT: seasons.map((s) => (patBySeason.get(s) || []).length),
        FG: seasons.map((s) => (fgBySeason.get(s) || []).length),
      },
      order: ['PAT', 'FG'],
      colors: { PAT: cssVar('--cat-1'), FG: cssVar('--cat-3') },
    });

    const allSeasons = DATA.filters.money_unit.season;
    // See reopenSeasons() in charts.js -- keeps this heatmap's columns matching
    // the insight text below (Season never narrows it, only Kicker/Quarter do).
    const heatmapFgRows = fgs(reopenSeasons(DATA.units.money_unit, state, allSeasons));
    renderHeatmap(document.getElementById('pkd-heatmap'), {
      rowLabels: FG_DIST_BUCKETS, colLabels: allSeasons,
      cellFor: (bucket, season) => {
        const g = heatmapFgRows.filter((r) => r.season === season && fgDistBucket(r.distance) === bucket);
        if (!g.length) return null;
        return { pct: makeRate(g), n: g.length, made: makes(g).length };
      },
      title: (bucket, season) => `${bucket} yds, ${season}`,
    });

    const hashes = HASH_ORDER;
    const byHash = groupBy(fgRows.filter((r) => r.hash_kicked_from), 'hash_kicked_from');
    const hashesPresent = hashes.filter((h) => byHash.has(h));
    if (hashesPresent.length) {
      renderBar(document.getElementById('pkd-hash'), {
        categories: hashesPresent,
        values: hashesPresent.map((h) => makeRate(byHash.get(h))),
        labelFmt: (v) => pct(v, 0),
        colorFn: () => cssVar('--cat-3'),
        tooltipExtra: (h) => `${byHash.get(h).length} kicks`,
      });
    } else {
      document.getElementById('pkd-hash').innerHTML = '<div class="data-note">No charted hash data in the current filter (2023 onward only).</div>';
    }

    const snapLocs = snapLocationScale(DATA.units.money_unit);
    const bySnapLoc = groupBy(fgRows.filter((r) => r.snap_location).map((r) => ({ ...r, snap_location: String(r.snap_location) })), 'snap_location');
    const snapLocsPresent = snapLocs.filter((s) => bySnapLoc.has(s));
    if (snapLocsPresent.length) {
      renderBar(document.getElementById('pkd-snaploc'), {
        categories: snapLocsPresent,
        values: snapLocsPresent.map((s) => makeRate(bySnapLoc.get(s))),
        labelFmt: (v) => pct(v, 0),
        colorFn: () => cssVar('--cat-5'),
        tooltipExtra: (s) => `${bySnapLoc.get(s).length} kicks`,
      });
    } else {
      document.getElementById('pkd-snaploc').innerHTML = '<div class="data-note">No charted Snap Location data in the current filter (2023 onward only).</div>';
    }

    const scoreBySeason = groupBy(rows, 'season');
    renderBar(document.getElementById('pkd-scoretrend'), {
      categories: seasons,
      values: seasons.map((s) => mean((scoreBySeason.get(s) || []).map((r) => r.score))),
      labelFmt: (v) => fmt(v, 0),
      colorFn: (s, v) => (v >= 50 ? cssVar('--good') : cssVar('--critical')),
      tooltipExtra: (s) => `${(scoreBySeason.get(s) || []).length} kicks`,
    });

    const kickers = DATA.filters.money_unit.kicker.filter((k) => rows.some((r) => r.kicker === k));
    const tbody = kickers.map((k) => {
      const kRows = rows.filter((r) => r.kicker === k);
      const kSeasons = [...new Set(kRows.map((r) => r.season))].sort();
      const kFg = fgs(kRows), kPat = pats(kRows), kFgMade = makes(kFg);
      const opRows = kRows.filter((r) => r.snap_to_kick !== null);
      const avgOp = mean(opRows.map((r) => r.snap_to_kick));
      return `<tr>
        <td class="name">${k}</td>
        <td>${kSeasons.length === 1 ? kSeasons[0] : `${kSeasons[0]}–${kSeasons[kSeasons.length - 1]}`}</td>
        <td>${makes(kPat).length}/${kPat.length}</td>
        <td>${pct(makeRate(kPat), 0)}</td>
        <td>${makes(kFg).length}/${kFg.length}</td>
        <td>${pct(makeRate(kFg), 0)}</td>
        <td>${kFgMade.length ? Math.max(...kFgMade.map((r) => r.distance)) + ' yds' : '—'}</td>
        <td>${fmt(mean(kRows.map((r) => r.score)), 0)}</td>
        <td>${avgOp !== null ? fmt(avgOp, 2) + 's' : '—'}</td>
      </tr>`;
    }).join('');
    document.getElementById('pkd-table-body').innerHTML = tbody || '<tr><td colspan="9" style="text-align:center; color:var(--muted);">No kickers in current filter.</td></tr>';
  }
  render();
}

/* ------------------------------------------------------------------------ tabs ---- */

const TAB_RENDERERS = { exec: execTab, h2h: h2hTab, deep: deepTab };

function showTab(tab) {
  document.querySelectorAll('#pk-tabs .tabbtn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  TAB_RENDERERS[tab](document.getElementById('pk-stage'));
}

document.querySelectorAll('#pk-tabs .tabbtn').forEach((btn) => {
  btn.addEventListener('click', () => showTab(btn.dataset.tab));
});

fetch('../data/special-teams.json')
  .then((r) => r.json())
  .then((data) => { DATA = data; showTab('exec'); })
  .catch((err) => {
    document.getElementById('pk-stage').innerHTML = `<div class="card"><div class="card-body">Couldn't load data/special-teams.json — ${err}. Run scripts/build_special_teams_data.py first, and serve over http:// not file://.</div></div>`;
  });
</script>
