<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Teams Overview — Carroll Football Analytics</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  /* .unit-header and .kpirow-6 live in css/theme.css -- identical across pages,
     don't re-declare them here (moved out 2026-07-30/2026-08-01). */
  .chartgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .chartgrid .card-body { min-height: 190px; }
  .data-note { font-size: 10.5px; color: var(--muted); margin-top: 6px; }
  select.fp-select-inline { font-family: inherit; font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); }

  /* ---- responsive (2026-07-29) ---- */
  @media (max-width: 900px) {
    .chartgrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page">
  <nav class="sitenav">
    <div class="brand"><span class="mark">CU</span> Carroll Football Analytics</div>
    <div class="links">
      <a href="../index.html">Overview</a>
      <a href="special-teams-overview.html" class="active">Special Teams</a>
      <a href="lifting-strength.html">Lifting &amp; Strength</a>
      <a href="offense.html">Offense</a>
      <a href="defense.html">Defense</a>
      <a href="rankings.html">Rankings</a>
    </div>
  </nav>

  <div class="intro">
    <h1>Special Teams Overview</h1>
  </div>

  <div class="subnav-label">Position Overview</div>
  <div class="tabbar" id="position-subnav">
    <a class="tabbtn active" href="special-teams-overview.html">Overview</a>
    <a class="tabbtn" href="placekicker.html">Placekicker</a>
    <a class="tabbtn" href="kickoff-kicker.html">Kickoff Kicker</a>
    <a class="tabbtn" href="punter.html">Punter</a>
    <a class="tabbtn" href="short-snapper.html">Short Snapper</a>
    <a class="tabbtn" href="long-snapper.html">Long Snapper</a>
  </div>

  <div class="tabbar" id="unit-tabs">
    <button class="tabbtn active" data-unit="overview">Team Overview</button>
    <button class="tabbtn" data-unit="money_unit">Money Unit</button>
    <button class="tabbtn" data-unit="punt_return">Punt Return</button>
    <button class="tabbtn" data-unit="punt">Punt</button>
    <button class="tabbtn" data-unit="kickoff">Kickoff</button>
    <button class="tabbtn" data-unit="kickoff_return">Kickoff Return</button>
  </div>

  <div class="stage" id="unit-stage"></div>
</div>

<script src="../js/charts.js"></script>
<script>
let DATA = null;

/* buildFilterPanel / wireFilterPanel / readFilterState / applyFilters now live in
   js/charts.js (shared with lifting-strength.html) -- rebuilt 2026-07-30 as a
   checkbox-list panel instead of native <select multiple>, per the user's "filtering
   is not intuitive" feedback. Don't re-add local copies here. */

/* ------------------------------------------------------------ shared KPIs --- */

/* kpiHTML/setKPI now live in js/charts.js (hoisted 2026-08-01 -- every Phase 2
   position page needs the same KPI-tile markup, don't re-add local copies). */

/* ----------------------------------------------------- game-level trend ----- */

/* gameTrend/renderTrendCard now live in js/charts.js (hoisted 2026-07-30 --
   Offense/Defense need the identical "Last Game vs Previous Game" trend
   card, don't re-add a local copy here). */

/* ============================================================================
   TEAM OVERVIEW (added 2026-07-30, per the user: "this is supposed to be a
   view of the special teams units as a whole" -- every other tab on this page
   is one unit at a time; this is the only place all 5 get compared directly,
   using the Value/Score "points added over expectation" metric every unit's
   own sheet already computes (Punt Return/Kickoff Return's real columns were
   never wired into the pipeline before this pass -- see the intro copy).
   ============================================================================ */

const UNIT_KEYS = ['money_unit', 'punt', 'punt_return', 'kickoff', 'kickoff_return'];
const UNIT_LABELS = {
  money_unit: 'Money Unit', punt: 'Punt', punt_return: 'Punt Return',
  kickoff: 'Kickoff', kickoff_return: 'Kickoff Return',
};
const OVERVIEW_FILTERS = [{ field: 'season', label: 'Season' }];

function teamOverviewTab(root) {
  const allSeasons = [...new Set(UNIT_KEYS.flatMap((u) => DATA.filters[u].season))].sort();
  root.innerHTML = `
    <div class="frame-wrap active">
      <div class="slide">
        <div class="unit-header">
          <div class="brandmark"><span class="crest">CU</span><h2>Team Overview</h2></div>
          <div class="sub">All 5 Special Teams Units · Carroll Special Teams</div>
        </div>
        <div class="shelf" id="to-shelf"></div>
        <div class="body">
          <div class="kpirow-5" id="to-kpis">
            ${UNIT_KEYS.map((u) => kpiHTML(`to-${u}`, `${UNIT_LABELS[u]} Avg Score`)).join('')}
          </div>
          <div class="chartgrid">
            <div class="card"><div class="card-head"><h3>Avg Score by Unit</h3></div><div class="card-body" id="to-byunit"></div></div>
            <div class="card"><div class="card-head"><h3>Avg Score by Season (all units combined)</h3></div><div class="card-body" id="to-byseason"></div></div>
          </div>
          <div class="card" style="margin-bottom:14px;">
            <div class="card-head"><h3>Snap/Play Volume by Unit</h3></div>
            <div class="card-body" id="to-volume"></div>
          </div>
          <div class="card">
            <div class="card-head"><h3>Avg Score — unit × season</h3></div>
            <div class="card-body">
              <table class="mini">
                <thead><tr><th>Unit</th>${allSeasons.map((s) => `<th style="text-align:right;">${s}</th>`).join('')}<th style="text-align:right;">All Time</th></tr></thead>
                <tbody id="to-table-body"></tbody>
              </table>
              <div class="insight">Avg Score (0–100 rescale of each unit's own Value metric) per season — always shows every season regardless of the Season filter above, which only scopes the KPIs/charts (this table's whole point is comparing across seasons at once). A dash means that unit has no charted plays that season.</div>
            </div>
          </div>
        </div>
        <div class="footer-note">Source: all 5 Carroll Special Teams sheets' own Value/Score columns ("points added over expectation" vs. an average Carroll attempt at that unit), Carroll_Special_Teams_2021_Current.xlsx.</div>
      </div>
    </div>`;

  document.getElementById('to-shelf').innerHTML = buildFilterPanel('to', OVERVIEW_FILTERS, { season: allSeasons });
  wireFilterPanel('to', OVERVIEW_FILTERS, render);

  function render() {
    const state = readFilterState('to', OVERVIEW_FILTERS);
    const rowsByUnit = {};
    UNIT_KEYS.forEach((u) => { rowsByUnit[u] = applyFilters(DATA.units[u], { season: state.season }); });
    const totalRows = UNIT_KEYS.reduce((s, u) => s + rowsByUnit[u].length, 0);
    document.getElementById('to-summary').textContent = `${totalRows} plays across all units in view`;

    UNIT_KEYS.forEach((u) => {
      const rows = rowsByUnit[u];
      setKPI(`to-${u}`, fmt(mean(rows.map((r) => r.score)), 1), `${rows.length} plays`);
    });

    renderBar(document.getElementById('to-byunit'), {
      categories: UNIT_KEYS.map((u) => UNIT_LABELS[u]),
      values: UNIT_KEYS.map((u) => mean(rowsByUnit[u].map((r) => r.score))),
      labelFmt: (v) => fmt(v, 0),
      colorFn: (name, v) => (v === null ? cssVar('--muted') : v >= 50 ? cssVar('--good') : cssVar('--critical')),
      tooltipExtra: (name, i) => `${rowsByUnit[UNIT_KEYS[i]].length} plays`,
    });

    const allRows = UNIT_KEYS.flatMap((u) => rowsByUnit[u]);
    const byseason = groupBy(allRows, 'season');
    const seasonsInView = allSeasons.filter((s) => byseason.has(s));
    renderBar(document.getElementById('to-byseason'), {
      categories: seasonsInView,
      values: seasonsInView.map((s) => mean(byseason.get(s).map((r) => r.score))),
      labelFmt: (v) => fmt(v, 0),
      colorFn: () => cssVar('--cat-1'),
      tooltipExtra: (s) => `${byseason.get(s).length} plays`,
    });

    renderBar(document.getElementById('to-volume'), {
      categories: UNIT_KEYS.map((u) => UNIT_LABELS[u]),
      values: UNIT_KEYS.map((u) => rowsByUnit[u].length),
      labelFmt: (v) => String(v),
      colorFn: (name, v, i) => catColor(i),
      tooltipExtra: (name, i) => `${pct(totalRows ? rowsByUnit[UNIT_KEYS[i]].length / totalRows : null, 0)} of all plays in view`,
    });

    // Deliberately reads DATA.units directly, NOT the season-filtered
    // rowsByUnit above -- see the table's own insight text.
    const tbody = UNIT_KEYS.map((u) => {
      const rows = DATA.units[u];
      const byS = groupBy(rows, 'season');
      const cells = allSeasons.map((s) => {
        const g = byS.get(s);
        return `<td style="text-align:right;">${g && g.length ? fmt(mean(g.map((r) => r.score)), 0) : '—'}</td>`;
      }).join('');
      return `<tr><td class="name">${UNIT_LABELS[u]}</td>${cells}<td style="text-align:right; font-weight:700;">${rows.length ? fmt(mean(rows.map((r) => r.score)), 0) : '—'}</td></tr>`;
    }).join('');
    document.getElementById('to-table-body').innerHTML = tbody;
  }
  render();
}

/* ============================================================================
   MONEY UNIT
   ============================================================================ */

const MONEY_FILTERS = [
  { field: 'fg_exp', label: 'FG / EXP' },
  { field: 'is_home', label: 'Home/Away' },
  { field: 'quarter', label: 'Quarter' },
  { field: 'season', label: 'Season' },
  { field: 'kicker', label: 'Kicker' },
  { field: 'long_snapper', label: 'Long Snapper' },
];

function moneyUnitTab(root) {
  const filterValues = { ...DATA.filters.money_unit};
  root.innerHTML = `
    <div class="frame-wrap active">
      <div class="slide">
        <div class="unit-header">
          <div class="brandmark"><span class="crest">CU</span><h2>Money Unit</h2></div>
          <div class="sub">PAT / Field Goal · Carroll Special Teams</div>
        </div>
        <div class="shelf" id="mu-shelf"></div>
        <div class="body">
          <div class="kpirow-6" id="mu-kpis">
            ${kpiHTML('mu-att', 'Kicks Attempted')}
            ${kpiHTML('mu-fgpct', 'FG %', '--good')}
            ${kpiHTML('mu-patpct', 'PAT %', '--good')}
            ${kpiHTML('mu-s2k', 'Avg Snap to Kick')}
            ${kpiHTML('mu-fgdist', 'Avg FG Distance')}
            ${kpiHTML('mu-blocked', 'Kicks Blocked', '--critical')}
          </div>
          <div class="chartgrid">
            <div class="card"><div class="card-head"><h3>Snap to Kick vs Distance</h3></div><div class="card-body" id="mu-scatter"></div></div>
            <div class="card"><div class="card-head"><h3>FG % by Distance Bucket</h3></div><div class="card-body" id="mu-fgbucket"></div></div>
            <div class="card"><div class="card-head"><h3>Make % by Hash Kicked From</h3></div><div class="card-body" id="mu-hash"></div></div>
            <div class="card"><div class="card-head"><h3>Misses by Location</h3></div><div class="card-body" id="mu-miss"><div class="data-note">Only "Blocked" is currently tracked as a miss reason in the source data (the Tableau version's L/Short breakdown isn't captured yet).</div></div></div>
          </div>
          <div class="grid2">
            <div class="card"><div class="card-body" id="mu-snapcatch"></div></div>
            <div class="card"><div class="card-body" id="mu-s2ktrend"></div></div>
          </div>
        </div>
        <div class="footer-note">Source: Carroll PAT-FG sheet, Carroll_Special_Teams_2021_Current.xlsx (236 rows). Snap-timing fields recompute only from rows where they're actually charted.</div>
      </div>
    </div>`;

  document.getElementById('mu-shelf').innerHTML = buildFilterPanel('mu', MONEY_FILTERS, filterValues);
  wireFilterPanel('mu', MONEY_FILTERS, render);

  function render() {
    const state = readFilterState('mu', MONEY_FILTERS);
    const rows = applyFilters(DATA.units.money_unit, state);
    document.getElementById('mu-summary').textContent = `${rows.length} kicks in view`;

    // Real duplication found in the 2026-07-30 optimization pass: this page
    // predates fgs()/pats()/makes() being hoisted into js/charts.js (they
    // were only ever wired up for Placekicker/Short Snapper), and re-implemented
    // the identical filters inline with local names that happened to shadow
    // the global helpers -- functionally fine but a silent duplicate of logic
    // that already lives in one shared place. Now calls the shared helpers.
    const madeRows = makes(rows);
    const fgRows = fgs(rows);
    const patRows = pats(rows);
    const fgMakes = fgRows.filter((r) => r.make).length;
    const patMakes = patRows.filter((r) => r.make).length;
    const s2k = mean(rows.map((r) => r.snap_to_kick));
    const fgDist = mean(fgRows.map((r) => r.distance));
    const blocked = rows.filter((r) => r.miss_location === 'Blocked').length;

    setKPI('mu-att', `${madeRows.length}/${rows.length}`, 'made / attempted');
    setKPI('mu-fgpct', pct(fgRows.length ? fgMakes / fgRows.length : null), `${fgMakes}/${fgRows.length} field goals`);
    setKPI('mu-patpct', pct(patRows.length ? patMakes / patRows.length : null), `${patMakes}/${patRows.length} PATs`);
    setKPI('mu-s2k', `${fmt(s2k, 2)}s`, `${rows.filter((r) => r.snap_to_kick !== null).length} charted`);
    setKPI('mu-fgdist', `${fmt(fgDist, 1)} yds`);
    setKPI('mu-blocked', String(blocked));

    renderScatter(document.getElementById('mu-scatter'), {
      points: rows.filter((r) => r.snap_to_kick !== null && r.distance !== null).map((r) => ({
        x: r.snap_to_kick, y: r.distance, group: r.make ? 'Make' : 'Miss',
        label: [
          `<div class="tt-title">${r.kicker} — ${r.make ? 'Make' : 'Miss'}</div>`,
          `<div class="tt-row"><span>Snap to kick</span><span>${fmt(r.snap_to_kick, 2)}s</span></div>`,
          `<div class="tt-row"><span>Distance</span><span>${r.distance} yd</span></div>`,
          `<div class="tt-divider"></div>`,
          `<div class="tt-muted">${r.fg_exp} vs ${r.opponent}, ${r.date} · Q${r.quarter}${r.hash_kicked_from ? ` · Hash ${r.hash_kicked_from}` : ''}</div>`,
        ].join(''),
      })),
      xLabel: 'Snap to kick (s)', yLabel: 'Distance (yd)',
      colorMap: { Make: cssVar('--good'), Miss: cssVar('--critical') },
    });

    const fgByBucket = groupBy(fgRows.map((r) => ({ ...r, _b: fgDistBucket(r.distance) })), '_b');
    renderBar(document.getElementById('mu-fgbucket'), {
      categories: FG_DIST_BUCKETS,
      values: FG_DIST_BUCKETS.map((b) => {
        const g = fgByBucket.get(b);
        if (!g || !g.length) return null;
        return g.filter((r) => r.make).length / g.length;
      }),
      labelFmt: (v) => pct(v, 0),
      colorFn: () => cssVar('--cat-1'),
      tooltipExtra: (b) => `${(fgByBucket.get(b) || []).length} kicks`,
    });

    const hashes = HASH_ORDER;
    const byHash = groupBy(rows.filter((r) => r.hash_kicked_from), 'hash_kicked_from');
    renderBar(document.getElementById('mu-hash'), {
      categories: hashes.filter((h) => byHash.has(h)),
      values: hashes.filter((h) => byHash.has(h)).map((h) => byHash.get(h).filter((r) => r.make).length / byHash.get(h).length),
      labelFmt: (v) => pct(v, 0),
      colorFn: () => cssVar('--cat-3'),
      tooltipExtra: (h) => `${byHash.get(h).length} kicks`,
    });

    const missRows = rows.filter((r) => !r.make && r.miss_location);
    const missCounts = groupBy(missRows, 'miss_location');
    if (missCounts.size) {
      const cats = [...missCounts.keys()];
      renderBar(document.getElementById('mu-miss'), {
        categories: cats, values: cats.map((c) => missCounts.get(c).length),
        labelFmt: (v) => String(v), colorFn: () => cssVar('--critical'),
        tooltipExtra: (c) => `${pct(missRows.length ? missCounts.get(c).length / missRows.length : null, 0)} of misses · ${pct(fgRows.length ? missCounts.get(c).length / fgRows.length : null, 0)} of all FG attempts`,
      });
    } else {
      // Real bug found 2026-07-30 re-validating this page: this branch didn't
      // exist, so filtering down to a subset with zero blocked kicks left the
      // PREVIOUS filter's bar chart on screen instead of clearing it.
      document.getElementById('mu-miss').innerHTML = '<div class="data-note">No blocked kicks in the current filter. Only "Blocked" is currently tracked as a miss reason in the source data (the Tableau version\'s L/Short breakdown isn\'t captured yet).</div>';
    }

    renderTrendCard(document.getElementById('mu-snapcatch'), rows, 'snap_to_catch', 's', 'Avg Snap to Catch');
    renderTrendCard(document.getElementById('mu-s2ktrend'), rows, 'snap_to_kick', 's', 'Avg Snap to Kick');
  }
  render();
}

/* ============================================================================
   PUNT
   ============================================================================ */

const PUNT_FILTERS = [
  { field: 'snapper', label: 'Snapper Name' },
  { field: 'next_drive_outcome', label: 'Next Drive Outcome' },
  { field: 'is_home', label: 'Home/Away' },
  { field: 'quarter', label: 'Quarter' },
  { field: 'season', label: 'Season' },
  { field: 'opponent', label: 'Opponent' },
  { field: 'punter', label: 'Punter' },
];

function puntTab(root) {
  const filterValues = { ...DATA.filters.punt};
  root.innerHTML = `
    <div class="frame-wrap active">
      <div class="slide">
        <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Punt</h2></div><div class="sub">Carroll Special Teams · Punt Unit</div></div>
        <div class="shelf" id="pt-shelf"></div>
        <div class="body">
          <div class="kpirow-6">
            ${kpiHTML('pt-n', '# of Punts')}
            ${kpiHTML('pt-hang', 'Avg Hangtime')}
            ${kpiHTML('pt-dist', 'Avg Distance')}
            ${kpiHTML('pt-s2k', 'Avg Snap to Kick')}
            ${kpiHTML('pt-fp', 'Avg Field Position')}
            ${kpiHTML('pt-pts', 'Avg Points Scored')}
          </div>
          <div class="chartgrid">
            <div class="card"><div class="card-head"><h3>Return Length vs Hangtime</h3></div><div class="card-body" id="pt-scatter"></div></div>
            <div class="card"><div class="card-head"><h3>Punts by Outcome</h3></div><div class="card-body" id="pt-outcome"></div></div>
            <div class="card"><div class="card-head"><h3>Drive Success by Field Position</h3></div><div class="card-body" id="pt-success"></div></div>
            <div class="card"><div class="card-head"><h3>Outcome by Field Position</h3></div><div class="card-body" id="pt-outcomefp"></div></div>
          </div>
          <div class="grid2">
            <div class="card"><div class="card-body" id="pt-s2ktrend"></div></div>
            <div class="card"><div class="card-body" id="pt-disttrend"></div></div>
          </div>
        </div>
        <div class="footer-note">Source: Carroll Punt sheet, Carroll_Special_Teams_2021_Current.xlsx (247 rows).</div>
      </div>
    </div>`;

  document.getElementById('pt-shelf').innerHTML = buildFilterPanel('pt', PUNT_FILTERS, filterValues);
  wireFilterPanel('pt', PUNT_FILTERS, render);

  function render() {
    const state = readFilterState('pt', PUNT_FILTERS);
    const rows = applyFilters(DATA.units.punt, state);
    document.getElementById('pt-summary').textContent = `${rows.length} punts in view`;

    setKPI('pt-n', String(rows.length));
    setKPI('pt-hang', `${fmt(mean(rows.map((r) => r.hangtime)), 2)}s`, `${rows.filter((r) => r.hangtime !== null).length} charted`);
    setKPI('pt-dist', `${fmt(mean(rows.map((r) => r.total_distance)))} yds`);
    setKPI('pt-s2k', `${fmt(mean(rows.map((r) => r.snap_to_kick)), 2)}s`, `${rows.filter((r) => r.snap_to_kick !== null).length} charted`);
    setKPI('pt-fp', fmt(mean(rows.map((r) => r.converted_los))));
    setKPI('pt-pts', fmt(mean(rows.map((r) => r.next_drive_points)), 2));

    const outcomeColors = categoricalColorMap(DATA.filters.punt.next_drive_outcome.length ? ['No Score', 'Field Goal', 'Touchdown', 'Safety'] : []);
    renderScatter(document.getElementById('pt-scatter'), {
      points: rows.filter((r) => r.hangtime !== null && r.return_length !== null).map((r) => ({
        x: r.hangtime, y: r.return_length, group: r.next_drive_outcome || 'No Score',
        label: [
          `<div class="tt-title">${r.punter || '—'}</div>`,
          `<div class="tt-row"><span>Hangtime</span><span>${fmt(r.hangtime, 2)}s</span></div>`,
          `<div class="tt-row"><span>Return length</span><span>${r.return_length} yd</span></div>`,
          `<div class="tt-row"><span>Kick outcome</span><span>${r.kick_outcome || '—'}</span></div>`,
          `<div class="tt-divider"></div>`,
          `<div class="tt-muted">vs ${r.opponent}, ${r.date} · Q${r.quarter} · Next drive: ${r.next_drive_outcome || 'No Score'}</div>`,
        ].join(''),
      })),
      xLabel: 'Hangtime (s)', yLabel: 'Return length (yd)',
      colorMap: outcomeColors,
    });

    const outcomes = ['Downed', 'Fair Catch', 'Out of Bounds', 'Touchback', 'Muff', 'Return', 'Return Touchdown'].filter((o) => rows.some((r) => r.kick_outcome === o));
    renderBar(document.getElementById('pt-outcome'), {
      categories: outcomes,
      values: outcomes.map((o) => rows.filter((r) => r.kick_outcome === o).length),
      labelFmt: (v) => String(v),
      colorFn: (name) => categoricalColorMap(outcomes)[name],
      tooltipExtra: (o) => `${pct(rows.length ? rows.filter((r) => r.kick_outcome === o).length / rows.length : null, 0)} of punts in view`,
    });

    const buckets = sortBuckets([...new Set(rows.map((r) => r.field_bucket).filter(Boolean))]);
    const byBucket = groupBy(rows.filter((r) => r.field_bucket), 'field_bucket');
    renderBar(document.getElementById('pt-success'), {
      categories: buckets,
      values: buckets.map((b) => {
        const g = byBucket.get(b);
        return g.filter((r) => r.drive_success).length / g.length;
      }),
      labelFmt: (v) => pct(v, 0), colorFn: () => cssVar('--cat-1'),
      tooltipExtra: (b) => `${byBucket.get(b).length} punts`,
    });

    const outcomeCats = ['No Score', 'Field Goal', 'Touchdown', 'Safety'];
    const stackColors = categoricalColorMap(outcomeCats);
    renderStacked(document.getElementById('pt-outcomefp'), {
      categories: buckets,
      series: Object.fromEntries(outcomeCats.map((o) => [o, buckets.map((b) => byBucket.get(b).filter((r) => r.next_drive_outcome === o).length)])),
      order: outcomeCats, colors: stackColors,
    });

    renderTrendCard(document.getElementById('pt-s2ktrend'), rows, 'snap_to_kick', 's', 'Avg Snap to Kick');
    renderTrendCard(document.getElementById('pt-disttrend'), rows, 'total_distance', ' yds', 'Avg Punt Distance');
  }
  render();
}

/* ============================================================================
   PUNT RETURN
   ============================================================================ */

const PUNT_RETURN_FILTERS = [
  { field: 'kick_outcome', label: 'Kick Outcome' },
  { field: 'next_drive_outcome', label: 'Next Drive Outcome' },
  { field: 'is_home', label: 'Home/Away' },
  { field: 'quarter', label: 'Quarter' },
  { field: 'season', label: 'Season' },
  { field: 'opponent', label: 'Opponent' },
  { field: 'returner', label: 'Returner' },
];

function puntReturnTab(root) {

        </div>

      </div>
    </div>`;

  document.getElementById('prt-shelf').innerHTML = buildFilterPanel('prt', PUNT_RETURN_FILTERS, filterValues);
  wireFilterPanel('prt', PUNT_RETURN_FILTERS, render);

  function render() {
    const state = readFilterState('prt', PUNT_RETURN_FILTERS);
    const rows = applyFilters(DATA.units.punt_return, state);
    document.getElementById('prt-summary').textContent = `${rows.length} punts in view`;

    setKPI('prt-n', String(rows.length));
    setKPI('prt-carry', `${fmt(mean(rows.map((r) => r.carry_distance)))} yds`);
    setKPI('prt-ret', `${fmt(mean(rows.map((r) => r.return_length)))} yds`);
    setKPI('prt-s2k', `${fmt(mean(rows.map((r) => r.snap_to_kick)), 2)}s`, `${rows.filter((r) => r.snap_to_kick !== null).length} charted`);
    setKPI('prt-fp', fmt(mean(rows.map((r) => r.converted_los))));
    setKPI('prt-pts', fmt(mean(rows.map((r) => r.next_drive_points)), 2));

    const outcomeCats = ['No Score', 'Field Goal', 'Touchdown', 'Safety'];
    const outcomeColors = categoricalColorMap(outcomeCats);
    renderScatter(document.getElementById('prt-scatter'), {
      points: rows.filter((r) => r.hangtime !== null && r.return_length !== null).map((r) => ({
        x: r.hangtime, y: r.return_length, group: r.next_drive_outcome || 'No Score',
        label: [
          `<div class="tt-title">${r.returner || '—'}</div>`,
          `<div class="tt-row"><span>Hangtime</span><span>${fmt(r.hangtime, 2)}s</span></div>`,
          `<div class="tt-row"><span>Return length</span><span>${r.return_length} yd</span></div>`,
          `<div class="tt-row"><span>Kick outcome</span><span>${r.kick_outcome || '—'}</span></div>`,
          `<div class="tt-divider"></div>`,
          `<div class="tt-muted">vs ${r.opponent}, ${r.date} · Q${r.quarter} · Next drive: ${r.next_drive_outcome || 'No Score'}</div>`,
        ].join(''),
      })),
      xLabel: 'Hangtime (s)', yLabel: 'Return length (yd)', colorMap: outcomeColors,
    });

    const outcomes = ['Downed', 'Fair Catch', 'Returned', 'Touchback', 'Muff', 'Blocked'].filter((o) => rows.some((r) => r.kick_outcome === o));
    renderBar(document.getElementById('prt-outcome'), {
      categories: outcomes, values: outcomes.map((o) => rows.filter((r) => r.kick_outcome === o).length),
      labelFmt: (v) => String(v), colorFn: (name) => categoricalColorMap(outcomes)[name],
      tooltipExtra: (o) => `${pct(rows.length ? rows.filter((r) => r.kick_outcome === o).length / rows.length : null, 0)} of punts in view`,
    });

    const buckets = sortBuckets([...new Set(rows.map((r) => r.field_bucket).filter(Boolean))]);
    const byBucket = groupBy(rows.filter((r) => r.field_bucket), 'field_bucket');
    renderBar(document.getElementById('prt-successfp'), {
      categories: buckets,
      values: buckets.map((b) => byBucket.get(b).filter((r) => r.drive_success).length / byBucket.get(b).length),
      labelFmt: (v) => pct(v, 0), colorFn: () => cssVar('--cat-1'),
      tooltipExtra: (b) => `${byBucket.get(b).length} punts`,
    });

    const rlBucket = (rl) => (rl <= 5 ? '0-5' : rl <= 10 ? '6-10' : rl <= 15 ? '11-15' : rl <= 20 ? '16-20' : '21+');
    const withRL = rows.filter((r) => r.return_length !== null && r.return_length > 0);
    const byRL = groupBy(withRL.map((r) => ({ ...r, _rlb: rlBucket(r.return_length) })), '_rlb');
    const rlCats = ['0-5', '6-10', '11-15', '16-20', '21+'].filter((c) => byRL.has(c));
    renderBar(document.getElementById('prt-successrl'), {
      categories: rlCats,
      values: rlCats.map((c) => byRL.get(c).filter((r) => r.drive_success).length / byRL.get(c).length),
      labelFmt: (v) => pct(v, 0), colorFn: () => cssVar('--cat-3'),
      tooltipExtra: (c) => `${byRL.get(c).length} punts`,
    });

    renderTrendCard(document.getElementById('prt-rettrend'), rows, 'return_length', ' yds', 'Avg Return Length');

    renderStacked(document.getElementById('prt-fpoutcome'), {
      categories: buckets,
      series: Object.fromEntries(outcomeCats.map((o) => [o, buckets.map((b) => byBucket.get(b).filter((r) => r.next_drive_outcome === o).length)])),
      order: outcomeCats, colors: outcomeColors,
    });
  }
  render();
}

/* ------------------------------------------------------------------ tabs ---- */

const TAB_RENDERERS = {
  overview: teamOverviewTab,
  money_unit: moneyUnitTab,
  punt_return: puntReturnTab,
  punt: puntTab,
  kickoff: kickoffTab,
  kickoff_return: kickoffReturnTab,
};

function showUnit(unit) {
  document.querySelectorAll('#unit-tabs .tabbtn').forEach((b) => b.classList.toggle('active', b.dataset.unit === unit));
  const stage = document.getElementById('unit-stage');
  TAB_RENDERERS[unit](stage);
}

document.querySelectorAll('#unit-tabs .tabbtn').forEach((btn) => {
  btn.addEventListener('click', () => showUnit(btn.dataset.unit));
});

fetch('../data/special-teams.json')
  .then((r) => r.json())
  .then((data) => {
    DATA = data;
    showUnit('overview');
  })
  .catch((err) => {
    document.getElementById('unit-stage').innerHTML = `<div class="card"><div class="card-body">Couldn't load data/special-teams.json — ${err}. Run scripts/build_special_teams_data.py first, and serve this folder over http:// rather than opening the file directly (fetch() of a local JSON file is blocked under file://).</div></div>`;
  });
</script>
