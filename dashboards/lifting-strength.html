<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifting &amp; Strength — Carroll Football Analytics</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  /* .unit-header lives in css/theme.css -- identical in both dashboards, don't
     re-declare it here (moved out 2026-07-30, was byte-duplicated in both files). */

  .classgroup { margin-bottom: 22px; }
  .classgroup-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .classgroup-head .ribbon {
    background: var(--cat-2); color: #fff; font-weight: 700; font-size: 12px;
    padding: 4px 12px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em;
  }
  .lbgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .lbgrid-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    font-weight: 700; margin-bottom: 7px;
  }
  .lbgrid:last-of-type { margin-bottom: 0; }
  .lb-rank { color: var(--muted); font-variant-numeric: tabular-nums; width: 18px; display: inline-block; }
  .lb-empty { font-size: 11.5px; color: var(--muted); padding: 12px; }
  .card-head .count {
    font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--grid);
    border-radius: 999px; padding: 2px 8px; flex-shrink: 0;
  }
  /* Scrollable leaderboard body -- shows the full roster instead of a top-N cutoff
     (2026-07-30). Header row stays pinned via position:sticky while the body scrolls. */
  .lb-scroll-wrap { padding: 0 16px 13px; max-height: 360px; overflow-y: auto; }
  table.lb-scroll thead th {
    position: sticky; top: 0; z-index: 1; background: var(--page);
    box-shadow: 0 1px 0 var(--grid);
  }
  table.lb-scroll { margin: 0; }
  table.lb-scroll tbody tr:first-child td { padding-top: 7px; }

  .comparegrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .compare-legend { display: flex; gap: 18px; margin-bottom: 14px; font-size: 13px; }
  .compare-legend .sw { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .compare-legend .dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ---- responsive (2026-07-29) ---- */
  @media (max-width: 1100px) { .lbgrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) { .comparegrid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) {
    .lbgrid { grid-template-columns: 1fr; }
    .comparegrid { grid-template-columns: 1fr; }
    .lb-scroll-wrap { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>

<div class="page">
  <nav class="sitenav">
    <div class="brand"><span class="mark">CU</span> Carroll Football Analytics</div>
    <div class="links">
      <a href="special-teams-overview.html">Special Teams</a>
      <a href="placekicker.html">Positions</a>
      <a href="lifting-strength.html" class="active">Lifting &amp; Strength</a>
      <a href="offense.html">Offense</a>
      <a href="defense.html">Defense</a>
      <a href="opponent-scouting.html">Opponent Scouting</a>
      <a href="rankings.html">Rankings</a>
      <a href="glossary.html">Glossary</a>
      <a href="updates.html">Updates</a>
    </div>
  </nav>

  <div class="intro">
    <h1>Lifting &amp; Strength</h1>
  </div>

  <div class="tabbar" id="lift-tabs">
    <button class="tabbtn active" data-tab="alltime">All Time / Last Session</button>
    <button class="tabbtn" data-tab="seniorjunior">Senior / Junior</button>
    <button class="tabbtn" data-tab="sophfresh">Sophomore / Freshman</button>
    <button class="tabbtn" data-tab="compare">Class Comparison</button>
  </div>

  <div class="stage" id="lift-stage"></div>
</div>

<script src="../js/charts.js"></script>
<script>
let DATA = null;
// Extended 2026-07-30 per the user ("reporting dashboards of the other
// metrics... adding them onto the existing structure since we already have it
// broken out by grade") -- Strength Score/Athleticism Score (team-scope
// percentiles) and Broad Jump/Vertical/Pro Agility (raw athletic testing) join
// the original 4 lift metrics, grouped into two labeled sections per class
// group rather than one flat row now that there are 9 metrics instead of 4.
// Position-scope scores (Strength/Athleticism Score (Position)) deliberately
// left out of this pass -- see README for why.
const STRENGTH_METRICS = ['Combined Total', 'Bench', 'Squat', 'Clean', 'Strength Score (Team)'];
const ATHLETIC_METRICS = ['Broad Jump', 'Vertical', 'Pro Agility', 'Athleticism Score (Team)'];
const METRICS = [...STRENGTH_METRICS, ...ATHLETIC_METRICS];
const METRIC_UNITS = {
  'Combined Total': 'lbs', 'Bench': 'lbs', 'Squat': 'lbs', 'Clean': 'lbs', 'Weight': 'lbs', 'Height': 'in',
  'Strength Score (Team)': '', 'Athleticism Score (Team)': '', 'Broad Jump': 'in', 'Vertical': 'in', 'Pro Agility': 's',
};
// Pro Agility is a timed sprint -- lower is faster/better, the one metric here
// that isn't "bigger number wins" (matches Lifting Data's own z-score convention).
const LOWER_IS_BETTER = new Set(['Pro Agility']);
function metricLabel(metric, v) { return `${fmt(v, metric === 'Pro Agility' ? 2 : 1)}${METRIC_UNITS[metric] || ''}`; }

/* --------------------------------------------------- career-year alignment --- */
// Class Comparison (2026-07-30, per the user): "line up people at a point in
// time" -- a 2021-22 freshman's numbers should plot against a 2024-25 freshman's
// numbers at the same x position, not get spread across the chart by literal
// calendar year the way session_label comparison did before. `athlete_key|
// football_year -> class` is only populated for 2023-24+ (see the intro copy
// above), so real Freshman/Sophomore/... labels can't anchor every year -- the
// x-axis instead uses each athlete's OWN chronological order of recorded
// football_years ("Year 1" = their first season in this dataset, "Year 2" =
// their second, ...), which is always available and is exactly "career stage"
// for the years this dataset covers. The real class label is layered on top in
// the tooltip wherever it's known, not claimed as fact for years it isn't.
let CLASS_LOOKUP = null;
function buildClassLookup() {
  CLASS_LOOKUP = new Map();
  DATA.leaderboard_rows.forEach((r) => {
    if (r.class) CLASS_LOOKUP.set(`${r.athlete_key}|${r.football_year}`, r.class);
  });
}
const PERIOD_RANK = { 'December': 0, 'January': 1, 'April': 2, '—': 0 };
function athleteYearOrder(athlete) {
  const years = [...new Set(athlete.points.map((p) => p.football_year))].sort();
  return new Map(years.map((y, i) => [y, i + 1]));
}

/* ------------------------------------------------------------ leaderboard --- */

function leaderboardTable(title, rows) {
  // Show every qualifying athlete (all are non-zero -- the Lifting Data pipeline
  // never emits a zero-value row, an athlete with no recorded lift just has no
  // row), scrolled instead of truncated to a top-N slice (fixed 2026-07-30 per
  // user feedback -- the old top-12 cutoff hid most of the roster).
  const lowerBetter = LOWER_IS_BETTER.has(title);
  const top = [...rows].sort((a, b) => lowerBetter ? a.value - b.value : b.value - a.value);
  if (!top.length) {
    return `<div class="card"><div class="card-head"><h3>${title}</h3></div><div class="lb-empty">No qualifying sessions.</div></div>`;
  }
  const body = top.map((r, i) => `
    <tr>
      <td><span class="lb-rank">${i + 1}</span></td>
      <td class="name">${r.first_name} ${r.last_name}</td>
      <td>${r.session_label}</td>
      <td style="text-align:right; font-weight:700;">${metricLabel(title, r.value)}</td>
    </tr>`).join('');
  return `
    <div class="card">
      <div class="card-head"><h3>${title}</h3><span class="count">${top.length}</span></div>
      <div class="card-body lb-scroll-wrap">
        <table class="mini lb-scroll">
          <thead><tr><th></th><th>Name</th><th>Session</th><th style="text-align:right;">Value</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
}

// Shared by classGroupHTML/allTimeGroupHTML -- two labeled `.lbgrid` sections
// (Strength / Athletic Testing) instead of one flat row of 9 leaderboard cards.
function metricSectionsHTML(rowsFor) {
  return `
    <div class="lbgrid-label">Strength</div>
    <div class="lbgrid">
      ${STRENGTH_METRICS.map((m) => leaderboardTable(m, rowsFor(m))).join('')}
    </div>
    <div class="lbgrid-label">Athletic Testing</div>
    <div class="lbgrid">
      ${ATHLETIC_METRICS.map((m) => leaderboardTable(m, rowsFor(m))).join('')}
    </div>`;
}

function classGroupHTML(label, positionFilter) {
  // Routed through the shared applyFilters (js/charts.js) rather than a hand-
  // rolled condition here -- an earlier local copy of this filter had its own
  // "empty selection passes everything" bug (fixed 2026-07-30) that survived
  // because it wasn't actually using the shared, already-fixed implementation
  // despite documentation claiming it was.
  const rowsFor = (metric) => applyFilters(
    DATA.leaderboard_rows.filter((r) => r.class === label && r.metric === metric),
    { position: positionFilter });
  return `
    <div class="classgroup">
      <div class="classgroup-head"><span class="ribbon">${label}</span></div>
      ${metricSectionsHTML(rowsFor)}
    </div>`;
}

function allTimeGroupHTML(label, isLastSession, positionFilter) {
  const rowsFor = (metric) => {
    const candidates = applyFilters(
      DATA.leaderboard_rows.filter((r) => r.metric === metric && (!isLastSession || r.is_last_session)),
      { position: positionFilter });
    if (!isLastSession) {
      // All Time: one row per athlete -- their single best session for this
      // metric (lowest time for Pro Agility, highest value for everything else --
      // real bug found 2026-07-30 while adding Pro Agility: this reduction was
      // hardcoded "bigger wins," which would have shown each athlete's SLOWEST
      // Pro Agility time as their All-Time "best").
      const lowerBetter = LOWER_IS_BETTER.has(metric);
      const byAthlete = new Map();
      candidates.forEach((r) => {
        const cur = byAthlete.get(r.athlete_key);
        const better = !cur || (lowerBetter ? r.value < cur.value : r.value > cur.value);
        if (better) byAthlete.set(r.athlete_key, r);
      });
      return [...byAthlete.values()];
    }
    return candidates;
  };
  return `
    <div class="classgroup">
      <div class="classgroup-head"><span class="ribbon">${label}</span></div>
      ${metricSectionsHTML(rowsFor)}
    </div>`;
}

// Position filter now built on the shared checkbox-panel engine in js/charts.js
// (buildFilterPanel/wireFilterPanel/readFilterState) -- same one Special Teams
// uses, rebuilt 2026-07-30 per the user's "filtering is not intuitive" feedback.
const POSITION_FILTER_DEF = [{ field: 'position', label: 'Position' }];

function positionFilterHTML(tabId) {
  const positions = [...new Set(DATA.leaderboard_rows.map((r) => r.position).filter(Boolean))].sort();
  return buildFilterPanel(tabId, POSITION_FILTER_DEF, { position: positions });
}

function wirePositionFilter(tabId, onChange) {
  wireFilterPanel(tabId, POSITION_FILTER_DEF, onChange);
}

function readPositionFilter(tabId) {
  return readFilterState(tabId, POSITION_FILTER_DEF).position;
}

/* ---------------------------------------------------------------- tab: All Time / Last Session --- */

function allTimeTab(root) {
  root.innerHTML = `
    <div class="frame-wrap active"><div class="slide">
      <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Offseason Lifting</h2></div><div class="sub">All Time &amp; ${DATA.last_session.label} (Last Session)</div></div>
      <div class="shelf">${positionFilterHTML('at')}</div>
      <div class="body" id="at-body"></div>
      <div class="footer-note">Source: Lifting Data project's Strength (Combined Total/Bench/Squat/Clean/Strength Score) and Athletic Testing (Broad Jump/Vertical/Pro Agility/Athleticism Score) metrics, best value per athlete per session, 5 football years (2021-22 through 2025-26).</div>
    </div></div>`;
  wirePositionFilter('at', render);
  function render() {
    const pos = readPositionFilter('at');
    document.getElementById('at-body').innerHTML =
      allTimeGroupHTML('All Time', false, pos) + allTimeGroupHTML(`Last Session (${DATA.last_session.label})`, true, pos);
  }
  render();
}

/* ---------------------------------------------------------------- tab: class leaderboards --- */

function classTab(root, classA, classB, subtitle) {
  root.innerHTML = `
    <div class="frame-wrap active"><div class="slide">
      <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Offseason Lifting</h2></div><div class="sub">${subtitle}</div></div>
      <div class="shelf">${positionFilterHTML('ct')}</div>
      <div class="body" id="ct-body"></div>
      <div class="footer-note">Source: Lifting Data project. Class year derived from years-with-program, populated 2023-24 onward only.</div>
    </div></div>`;
  wirePositionFilter('ct', render);
  function render() {
    const pos = readPositionFilter('ct');
    document.getElementById('ct-body').innerHTML = classGroupHTML(classA, pos) + classGroupHTML(classB, pos);
  }
  render();
}

/* ---------------------------------------------------------------- tab: class comparison --- */

// Up to 4 athletes (2026-07-31, per the user) -- fixed categorical order per
// the dataviz skill (cat-1..cat-4, never reassigned/cycled), one slot per
// index. Slots 1-2 default to the first two athletes (today's minimum useful
// comparison); slots 3-4 default to a real "— None —" option rather than an
// arbitrary third/fourth athlete, since a coach may only want 2 or 3.
const COMPARE_SLOT_COUNT = 4;
const COMPARE_SLOT_COLORS = ['--cat-1', '--cat-2', '--cat-3', '--cat-4'];
const COMPARE_NONE_OPTION = { value: '', label: '— None —' };

function compareTab(root) {
  const names = DATA.athletes
    .map((a) => ({ key: a.athlete_key, label: `${a.first_name} ${a.last_name}` }))
    .sort((a, b) => a.label.localeCompare(b.label));
  const slotIndexes = [...Array(COMPARE_SLOT_COUNT).keys()];
  root.innerHTML = `
    <div class="frame-wrap active"><div class="slide">
      <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Offseason Lifting</h2></div><div class="sub">Class Comparison</div></div>
      <div class="shelf">
        <div class="fp-group" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          ${slotIndexes.map((i) => `
            <div class="fp-label" style="margin:0;">Athlete ${i + 1}</div>
            <div id="cmp-${i}" style="min-width:220px;"></div>
          `).join('')}
        </div>
      </div>
      <div class="body">
        <div class="compare-legend" id="cmp-legend"></div>
        <div class="comparegrid" id="cmp-charts"></div>
      </div>
      <div class="footer-note">Source: Lifting Data project — Combined Total, Bench, Squat, Clean, Strength Score, Broad Jump, Vertical, Pro Agility, Athleticism Score (best per session), Weight (per session), Height (per football year). X-axis is each athlete's own Year 1/Year 2/... (their first, second, ... recorded season in this dataset), not calendar year — a Year 1 point lines up with another athlete's Year 1 regardless of what actual football year each was in. Hover a point for the real session and class year (Freshman/Sophomore/Junior/Senior, where known — only populated 2023-24 onward).</div>
    </div></div>`;

  // Searchable combobox instead of a plain <select> -- scrolling through 230+
  // names alphabetically was exactly the "filtering/selection isn't intuitive"
  // complaint applied to athlete selection specifically. Type to narrow, click
  // to pick.
  const sels = slotIndexes.map((i) => makeSearchCombobox(document.getElementById(`cmp-${i}`), {
    options: i < 2 ? names.map((n) => ({ value: n.key, label: n.label })) : [COMPARE_NONE_OPTION, ...names.map((n) => ({ value: n.key, label: n.label }))],
    value: i < 2 ? names[i]?.key : '',
    onChange: () => render(), placeholder: 'Search athlete…',
  }));

  function seriesFor(athleteKey, metric) {
    const a = DATA.athletes.find((x) => x.athlete_key === athleteKey);
    if (!a) return { points: [], name: '' };
    const yearOrder = athleteYearOrder(a);
    const points = a.points
      .filter((p) => p.metric === metric)
      .map((p) => {
        const yearIdx = yearOrder.get(p.football_year);
        const periodRank = PERIOD_RANK[p.testing_period] ?? 0;
        return {
          value: p.value, yearIdx, periodRank, key: `${yearIdx}.${periodRank}`,
          session_label: p.session_label,
          classLabel: CLASS_LOOKUP.get(`${athleteKey}|${p.football_year}`) || null,
        };
      })
      .sort((x, y) => x.yearIdx - y.yearIdx || x.periodRank - y.periodRank);
    return { points, name: `${a.first_name} ${a.last_name}` };
  }

  function renderCompareChart(container, metric, activeSlots) {
    const seriesList = activeSlots.map(({ athleteKey, color }) => ({ ...seriesFor(athleteKey, metric), color }));
    // Aligned by career-year (each athlete's own Year 1/2/3...), not calendar
    // date -- see the "career-year alignment" note above seriesFor.
    const allKeys = [...new Set(seriesList.flatMap((s) => s.points.map((p) => p.key)))]
      .sort((k1, k2) => {
        const [y1, p1] = k1.split('.').map(Number), [y2, p2] = k2.split('.').map(Number);
        return y1 - y2 || p1 - p2;
      });
    const W = 380, H = 130, PAD = 8;
    const allVals = seriesList.flatMap((s) => s.points.map((p) => p.value));
    if (!allVals.length) { container.innerHTML = `<div class="card-body"><div class="lb-empty">No data.</div></div>`; return; }
    const vMin = Math.min(...allVals), vMax = Math.max(...allVals);
    const sx = (i) => PAD + (i / Math.max(1, allKeys.length - 1)) * (W - PAD * 2);
    const sy = (v) => H - PAD - ((v - vMin) / (vMax - vMin || 1)) * (H - PAD * 2);

    function pathFor(series, color) {
      if (series.points.length < 1) return '';
      const svgns = 'http://www.w3.org/2000/svg';
      const g = document.createElementNS(svgns, 'g');
      const idxOf = (key) => allKeys.indexOf(key);
      for (let i = 1; i < series.points.length; i++) {
        const p0 = series.points[i - 1], p1 = series.points[i];
        const line = document.createElementNS(svgns, 'line');
        line.setAttribute('x1', sx(idxOf(p0.key))); line.setAttribute('y1', sy(p0.value));
        line.setAttribute('x2', sx(idxOf(p1.key))); line.setAttribute('y2', sy(p1.value));
        line.setAttribute('stroke', color); line.setAttribute('stroke-width', '2'); line.setAttribute('stroke-linecap', 'round');
        g.appendChild(line);
      }
      series.points.forEach((p) => {
        const c = document.createElementNS(svgns, 'circle');
        c.setAttribute('cx', sx(idxOf(p.key))); c.setAttribute('cy', sy(p.value)); c.setAttribute('r', 3);
        c.setAttribute('fill', color);
        c.style.cursor = 'pointer';
        const classPart = p.classLabel ? `, ${p.classLabel}` : '';
        const html = [
          `<div class="tt-title">${series.name} — Year ${p.yearIdx}</div>`,
          `<div class="tt-row"><span>${metric}</span><span>${metricLabel(metric, p.value)}</span></div>`,
          `<div class="tt-muted">${p.session_label}${classPart}</div>`,
        ].join('');
        c.addEventListener('mouseenter', (e) => showTooltip(e.clientX, e.clientY, html));
        c.addEventListener('mousemove', (e) => showTooltip(e.clientX, e.clientY, html));
        c.addEventListener('mouseleave', hideTooltip);
        g.appendChild(c);
      });
      return g;
    }

    const svgns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.style.width = '100%'; svg.style.height = `${H}px`;
    seriesList.forEach((s) => { const g = pathFor(s, s.color); if (g) svg.appendChild(g); });

    container.innerHTML = `<div class="card-head"><h3>${metric} Comparison</h3></div><div class="card-body"></div>`;
    const body = container.querySelector('.card-body');
    body.appendChild(svg);
    const axis = el('div', 'axis-x');
    const labelFor = (key) => key ? `Year ${key.split('.')[0]}` : '';
    axis.appendChild(el('span', null, labelFor(allKeys[0])));
    axis.appendChild(el('span', null, labelFor(allKeys[allKeys.length - 1])));
    body.appendChild(axis);
  }

  function render() {
    // Only slots with a real athlete picked (a "— None —" slot is skipped
    // entirely, not rendered as an empty series) -- lets 2, 3, or 4 athletes
    // all work the same way instead of assuming exactly 2.
    const activeSlots = sels
      .map((sel, i) => ({ athleteKey: sel.value, color: cssVar(COMPARE_SLOT_COLORS[i]), name: names.find((n) => n.key === sel.value)?.label }))
      .filter((s) => s.athleteKey);

    document.getElementById('cmp-legend').innerHTML = activeSlots
      .map((s) => `<span class="sw"><span class="dot" style="background:${s.color}"></span>${s.name || '—'}</span>`)
      .join('');
    const chartsEl = document.getElementById('cmp-charts');
    chartsEl.innerHTML = '';
    if (!activeSlots.length) {
      chartsEl.innerHTML = '<div class="lb-empty">Pick at least one athlete above to compare.</div>';
      return;
    }
    [...STRENGTH_METRICS, 'Weight', 'Height', ...ATHLETIC_METRICS].forEach((metric) => {
      const card = el('div', 'card');
      chartsEl.appendChild(card);
      renderCompareChart(card, metric, activeSlots);
    });
  }
  render();
}

/* ------------------------------------------------------------------ tabs ---- */

const TAB_RENDERERS = {
  alltime: allTimeTab,
  seniorjunior: (root) => classTab(root, 'Senior', 'Junior', 'Senior &amp; Junior Leaderboards'),
  sophfresh: (root) => classTab(root, 'Sophomore', 'Freshman', 'Sophomore &amp; Freshman Leaderboards'),
  compare: compareTab,
};

function showTab(tab) {
  document.querySelectorAll('#lift-tabs .tabbtn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  TAB_RENDERERS[tab](document.getElementById('lift-stage'));
}

document.querySelectorAll('#lift-tabs .tabbtn').forEach((btn) => {
  btn.addEventListener('click', () => showTab(btn.dataset.tab));
});

fetch('../data/lifting.json')
  .then((r) => r.json())
  .then((data) => { DATA = data; buildClassLookup(); showTab('alltime'); })
  .catch((err) => {
    document.getElementById('lift-stage').innerHTML = `<div class="card"><div class="card-body">Couldn't load data/lifting.json — ${err}. Run scripts/build_lifting_data.py first, and serve over http:// not file://.</div></div>`;
  });
</script>
</body>
</html>
