<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kickoff Kicker — Carroll Football Analytics</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  /* .unit-header, .kpirow/.kpirow-5/.kpirow-6, .colcard-2/.kicker-col/etc.,
     .heat, .grid2 (2-col, already collapses at 900px) all already live in
     css/theme.css -- reuse .grid2 below rather than a page-local duplicate. */
</style>
</head>
<body>

<div class="page">
  <nav class="sitenav">
    <div class="brand"><span class="mark">CU</span> Carroll Football Analytics</div>
    <div class="links">
      <a href="../index.html">Overview</a>
      <a href="special-teams-overview.html">Special Teams</a>
      <a href="placekicker.html" class="active">Positions</a>
      <a href="lifting-strength.html">Lifting &amp; Strength</a>
      <a href="offense.html">Offense</a>
      <a href="defense.html">Defense</a>
      <a href="rankings.html">Rankings</a>
    </div>
  </nav>

  <div class="intro">
    <h1>Kickoff Kicker</h1>
  </div>

  <div class="subnav-label">Positions</div>
  <div class="tabbar" id="position-subnav">
    <a class="tabbtn" href="special-teams-overview.html">Overview</a>
    <a class="tabbtn" href="placekicker.html">Placekicker</a>
    <a class="tabbtn active" href="kickoff-kicker.html">Kickoff Kicker</a>
    <a class="tabbtn" href="punter.html">Punter</a>
    <a class="tabbtn" href="short-snapper.html">Short Snapper</a>
    <a class="tabbtn" href="long-snapper.html">Long Snapper</a>
  </div>

  <div class="tabbar" id="kk-tabs">
    <button class="tabbtn active" data-tab="exec">Executive Scorecard</button>
    <button class="tabbtn" data-tab="h2h">Kicker Head-to-Head</button>
    <button class="tabbtn" data-tab="deep">Situational Deep Dive</button>
  </div>

  <div class="stage" id="kk-stage"></div>
</div>

<script src="../js/charts.js"></script>
<script>
let DATA = null;

function deep(rows) { return rows.filter((r) => r.kick_type === 'Deep'); }
function onside(rows) { return rows.filter((r) => r.kick_type === 'Onside'); }
/* rate()/initials() now live in js/charts.js -- shared across position pages. */

/* ------------------------------------------------------------------ tab: Executive Scorecard --- */

const EXEC_FILTERS = [
  { field: 'season', label: 'Season', defaultLatestOnly: true },
  { field: 'kicker', label: 'Kicker' },
];

function execTab(root) {
  root.innerHTML = `
    <div class="frame-wrap active"><div class="slide">
      <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Kickoff Kicker</h2></div><div class="sub">Executive Scorecard</div></div>
      <div class="shelf" id="kke-shelf"></div>
      <div class="body">
        <div class="kpirow" id="kke-kpis">
          ${kpiHTML('kke-tb', 'Touchback Rate', '--good')}
          ${kpiHTML('kke-i25', 'Inside-25 Rate')}
          ${kpiHTML('kke-dist', 'Avg Kickoff Distance')}
          ${kpiHTML('kke-ret', 'Avg Return Allowed', '--critical')}
        </div>
        <div class="grid2" style="margin-bottom:14px;">
          <div class="card"><div class="card-head"><h3>Touchback % by Season</h3></div><div class="card-body" id="kke-tbseason"></div></div>
          <div class="card"><div class="card-head"><h3>Inside-25 % by Season</h3></div><div class="card-body" id="kke-i25season"></div></div>
          <div class="card"><div class="card-head"><h3>Avg Kickoff Distance by Season</h3></div><div class="card-body" id="kke-distseason"></div></div>
          <div class="card"><div class="card-head"><h3>Avg Return Allowed by Season</h3></div><div class="card-body" id="kke-retseason"></div></div>
        </div>
      </div>
      <div class="footer-note">Source: Carroll Kickoff sheet, Carroll_Special_Teams_2021_Current.xlsx (262 rows). Distance/return-allowed charted as two separate charts rather than one dual-axis chart -- different units, different meanings, never combined on one scale.</div>
    </div></div>`;

  document.getElementById('kke-shelf').innerHTML = buildFilterPanel('kke', EXEC_FILTERS, DATA.filters.kickoff);
  wireFilterPanel('kke', EXEC_FILTERS, render);

  function render() {
    const state = readFilterState('kke', EXEC_FILTERS);
    const rows = applyFilters(DATA.units.kickoff, state);
    document.getElementById('kke-summary').textContent = `${rows.length} kickoffs in view`;
    const deepRows = deep(rows);

    setKPI('kke-tb', pct(rate(deepRows, (r) => r.touchback)), `${deepRows.filter((r) => r.touchback).length}/${deepRows.length} deep kicks`);
    setKPI('kke-i25', pct(rate(deepRows, (r) => r.inside_25)));
    setKPI('kke-dist', `${fmt(mean(deepRows.map((r) => r.total_distance)), 1)} yds`);
    setKPI('kke-ret', `${fmt(mean(deepRows.map((r) => r.return_length)), 1)} yds`);

    const seasons = DATA.filters.kickoff.season.filter((s) => rows.some((r) => r.season === s));
    const byseason = groupBy(deepRows, 'season');
    renderBar(document.getElementById('kke-tbseason'), {
      categories: seasons, values: seasons.map((s) => { const g = byseason.get(s); return g ? rate(g, (r) => r.touchback) : null; }),
      labelFmt: (v) => pct(v, 0), colorFn: () => cssVar('--cat-1'), tooltipExtra: (s) => `${(byseason.get(s) || []).length} kicks`,
    });
    renderBar(document.getElementById('kke-i25season'), {
      categories: seasons, values: seasons.map((s) => { const g = byseason.get(s); return g ? rate(g, (r) => r.inside_25) : null; }),
      labelFmt: (v) => pct(v, 0), colorFn: () => cssVar('--cat-3'), tooltipExtra: (s) => `${(byseason.get(s) || []).length} kicks`,
    });
    renderBar(document.getElementById('kke-distseason'), {
      categories: seasons, values: seasons.map((s) => { const g = byseason.get(s); return g && g.length ? mean(g.map((r) => r.total_distance)) : null; }),
      labelFmt: (v) => `${fmt(v, 0)} yds`, colorFn: () => cssVar('--cat-4'), tooltipExtra: (s) => `${(byseason.get(s) || []).length} kicks`,
    });
    renderBar(document.getElementById('kke-retseason'), {
      categories: seasons, values: seasons.map((s) => { const g = byseason.get(s); return g && g.length ? mean(g.map((r) => r.return_length)) : null; }),
      labelFmt: (v) => `${fmt(v, 0)} yds`, colorFn: () => cssVar('--critical'), tooltipExtra: (s) => `${(byseason.get(s) || []).length} kicks`,
    });
  }
  render();
}

/* ------------------------------------------------------------------ tab: Kicker Head-to-Head --- */

const H2H_FILTERS = [{ field: 'season', label: 'Season', defaultLatestOnly: true }];
const OUTCOMES = ['Touchback', 'Out of Bounds', 'Returned', 'Onside'];

function outcomeOf(r) {
  if (r.kick_type === 'Onside') return 'Onside';
  if (r.touchback) return 'Touchback';
  if (r.out_of_bounds) return 'Out of Bounds';
  return 'Returned';
}

function h2hTab(root) {
  const kickers = DATA.filters.kickoff.kicker;
  root.innerHTML = `
    <div class="frame-wrap active"><div class="slide">
      <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Kickoff Kicker</h2></div><div class="sub">Kicker Head-to-Head</div></div>
      <div class="shelf" id="kkh-shelf"></div>
      <div class="body">
        <div class="colcard-2" style="margin-bottom:14px;">
          <div class="kicker-col">
            <div class="kicker-head">
              <div class="avatar" id="kkh-A-avatar" style="background:var(--cat-6);"></div>
              <div style="flex:1; min-width:0;"><div id="kkh-A-sel"></div><div class="yrs" id="kkh-A-years"></div></div>
            </div>
            <div class="kicker-body">
              <div class="mini-kpi-row">
                <div class="mini-kpi"><div class="l">TB%</div><div class="v" id="kkh-A-tb">—</div></div>
                <div class="mini-kpi"><div class="l">I25%</div><div class="v" id="kkh-A-i25">—</div></div>
                <div class="mini-kpi"><div class="l">Avg dist</div><div class="v" id="kkh-A-dist">—</div></div>
                <div class="mini-kpi"><div class="l">Hangtime <span style="font-size:9px; color:var(--muted); font-weight:400;">(2023+)</span></div><div class="v" id="kkh-A-hang">—</div></div>
              </div>
              <div class="card-head" style="padding:0 0 6px; border:none;"><h3>Outcome mix</h3></div>
              <div class="barchart" style="height:110px; padding-top:14px;">
                <div class="gridlines"><div></div><div></div><div></div></div>
                <div id="kkh-A-outchart" style="display:contents;"></div>
              </div>
            </div>
          </div>
          <div class="kicker-col">
            <div class="kicker-head">
              <div class="avatar" id="kkh-B-avatar" style="background:var(--cat-3);"></div>
              <div style="flex:1; min-width:0;"><div id="kkh-B-sel"></div><div class="yrs" id="kkh-B-years"></div></div>
            </div>
            <div class="kicker-body">
              <div class="mini-kpi-row">
                <div class="mini-kpi"><div class="l">TB%</div><div class="v" id="kkh-B-tb">—</div></div>
                <div class="mini-kpi"><div class="l">I25%</div><div class="v" id="kkh-B-i25">—</div></div>
                <div class="mini-kpi"><div class="l">Avg dist</div><div class="v" id="kkh-B-dist">—</div></div>
                <div class="mini-kpi"><div class="l">Hangtime <span style="font-size:9px; color:var(--muted); font-weight:400;">(2023+)</span></div><div class="v" id="kkh-B-hang">—</div></div>
              </div>
              <div class="card-head" style="padding:0 0 6px; border:none;"><h3>Outcome mix</h3></div>
              <div class="barchart" style="height:110px; padding-top:14px;">
                <div class="gridlines"><div></div><div></div><div></div></div>
                <div id="kkh-B-outchart" style="display:contents;"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="grid2" style="margin-bottom:14px;">
          <div class="card">
            <div class="card-head"><h3>Touchback % by season — selected kickers</h3></div>
            <div class="card-body">
              <div class="legend" id="kkh-tb-legend"></div>
              <div class="linewrap"><svg id="kkh-tb-svg" viewBox="0 0 1180 150" preserveAspectRatio="none"></svg></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h3>Avg return allowed by season — selected kickers</h3></div>
            <div class="card-body">
              <div class="legend" id="kkh-ret-legend"></div>
              <div class="linewrap"><svg id="kkh-ret-svg" viewBox="0 0 1180 150" preserveAspectRatio="none"></svg></div>
            </div>
          </div>
        </div>
      </div>
      <div class="footer-note">Source: Carroll Kickoff sheet, Carroll_Special_Teams_2021_Current.xlsx.</div>
    </div></div>`;

  document.getElementById('kkh-shelf').innerHTML = buildFilterPanel('kkh', H2H_FILTERS, DATA.filters.kickoff);
  wireFilterPanel('kkh', H2H_FILTERS, render);

  const selA = makeSearchCombobox(document.getElementById('kkh-A-sel'), {
    options: kickers.map((k) => ({ value: k, label: k })), value: kickers[0], onChange: render, placeholder: 'Search kicker…',
  });
  const selB = makeSearchCombobox(document.getElementById('kkh-B-sel'), {
    options: kickers.map((k) => ({ value: k, label: k })), value: kickers[1] || kickers[0], onChange: render, placeholder: 'Search kicker…',
  });

  function renderSide(prefix, kicker, rows) {
    document.getElementById(`${prefix}-avatar`).textContent = initials(kicker);
    const kRows = rows.filter((r) => r.kicker === kicker);
    const kDeep = deep(kRows);
    const seasons = [...new Set(kRows.map((r) => r.season))].sort();
    document.getElementById(`${prefix}-years`).textContent = seasons.length ? (seasons.length === 1 ? seasons[0] : `${seasons[0]} – ${seasons[seasons.length - 1]}`) : 'no kicks in range';
    document.getElementById(`${prefix}-tb`).textContent = pct(rate(kDeep, (r) => r.touchback));
    document.getElementById(`${prefix}-i25`).textContent = pct(rate(kDeep, (r) => r.inside_25));
    document.getElementById(`${prefix}-dist`).textContent = `${fmt(mean(kDeep.map((r) => r.total_distance)), 1)} yds`;
    const hangRows = kRows.filter((r) => r.hangtime !== null);
    document.getElementById(`${prefix}-hang`).textContent = hangRows.length ? `${fmt(mean(hangRows.map((r) => r.hangtime)), 2)}s` : '—';
    const byOutcome = groupBy(kRows.map((r) => ({ ...r, _o: outcomeOf(r) })), '_o');
    renderBar(document.getElementById(`${prefix}-outchart`), {
      categories: OUTCOMES.filter((o) => byOutcome.has(o)),
      values: OUTCOMES.filter((o) => byOutcome.has(o)).map((o) => byOutcome.get(o).length),
      labelFmt: (v) => String(v), colorFn: () => cssVar('--cat-1'),
      tooltipExtra: (o) => `${pct(kRows.length ? byOutcome.get(o).length / kRows.length : null, 0)} of this kicker's kicks`,
    });
  }

  function render() {
    const state = readFilterState('kkh', H2H_FILTERS);
    const rows = applyFilters(DATA.units.kickoff, state);
    document.getElementById('kkh-summary').textContent = `${rows.length} kickoffs in view`;
    renderSide('kkh-A', selA.value, rows);
    renderSide('kkh-B', selB.value, rows);

    document.getElementById('kkh-tb-legend').innerHTML = document.getElementById('kkh-ret-legend').innerHTML = `
      <span class="sw"><span class="dot" style="background:var(--cat-6)"></span>${selA.value}</span>
      <span class="sw"><span class="dot" style="background:var(--cat-3)"></span>${selB.value}</span>`;

    const seasons = DATA.filters.kickoff.season;
    const deepA = deep(rows.filter((r) => r.kicker === selA.value));
    const deepB = deep(rows.filter((r) => r.kicker === selB.value));
    const tbA = seasonSeries(deepA, seasons, (g) => rate(g, (r) => r.touchback));
    const tbB = seasonSeries(deepB, seasons, (g) => rate(g, (r) => r.touchback));
    renderTwoLine(document.getElementById('kkh-tb-svg'), seasons, tbA.values, tbB.values, cssVar('--cat-6'), cssVar('--cat-3'), selA.value, selB.value, (v) => pct(v, 0), tbA.counts, tbB.counts);
    const retA = seasonSeries(deepA, seasons, (g) => mean(g.map((r) => r.return_length)));
    const retB = seasonSeries(deepB, seasons, (g) => mean(g.map((r) => r.return_length)));
    renderTwoLine(document.getElementById('kkh-ret-svg'), seasons, retA.values, retB.values, cssVar('--cat-6'), cssVar('--cat-3'), selA.value, selB.value, (v) => `${fmt(v, 1)} yds`, retA.counts, retB.counts);
  }
  render();
}

/* ------------------------------------------------------------------ tab: Situational Deep Dive --- */

const DEEP_FILTERS = [
  { field: 'season', label: 'Season', defaultLatestOnly: true },
  { field: 'kicker', label: 'Kicker' },
  { field: 'quarter', label: 'Quarter' },
  { field: 'opponent', label: 'Opponent' },
  { field: 'is_home', label: 'Home/Away' },
];

function deepTab(root) {
  root.innerHTML = `
    <div class="frame-wrap active"><div class="slide">
      <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>Kickoff Kicker</h2></div><div class="sub">Situational Deep Dive</div></div>
      <div class="shelf" id="kkd-shelf"></div>
      <div class="body">
        <div class="kpirow" id="kkd-kpis">
          ${kpiHTML('kkd-tb', 'Touchback Rate', '--good')}
          ${kpiHTML('kkd-homeaway', 'Home vs Away TB%')}
          ${kpiHTML('kkd-bestq', 'Best Quarter (TB%)')}
          ${kpiHTML('kkd-onside', 'Onside Recovery Rate')}
        </div>
        <div class="grid2" style="margin-bottom:14px;">
          <div class="card"><div class="card-head"><h3>Touchback % &amp; volume by quarter</h3></div><div class="card-body" id="kkd-quarter"></div></div>
          <div class="card"><div class="card-head"><h3>Avg return allowed by season</h3></div><div class="card-body" id="kkd-retseason"></div></div>
        </div>
        <div class="card" style="margin-bottom:14px;">
          <div class="card-head"><h3>Touchback % — kicker × season</h3></div>
          <div class="card-body">
            <div class="heat" id="kkd-heatmap"></div>
            <div class="insight">Sequential blue = TB%; text = TB/attempts (deep kicks only). Columns always show all five seasons — only the Quarter filter narrows this grid (Kicker filter hides non-matching rows).</div>
          </div>
        </div>
        <div class="grid2" style="margin-bottom:14px;">
          <div class="card"><div class="card-head"><h3>Touchback % by hash kicked from</h3></div><div class="card-body" id="kkd-hash"><div class="data-note">Charted 2023 onward only.</div></div></div>
          <div class="card"><div class="card-head"><h3>Avg Kickoff Score by season</h3></div><div class="card-body" id="kkd-scoretrend"></div></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Kicker detail</h3></div>
          <div class="card-body">
            <table class="mini">
              <thead><tr><th>Kicker</th><th>Seasons</th><th>Kicks</th><th>TB%</th><th>I25%</th><th>Avg dist</th><th>Avg return</th><th>Avg Score</th><th>Hangtime</th></tr></thead>
              <tbody id="kkd-table-body"></tbody>
            </table>
            <div class="insight">Kicks/TB%/I25%/distance/return/Score are real and respect the filters above. Hangtime only reflects charted rows (2023 onward) — shows "—" for a kicker with none in view.</div>
          </div>
        </div>
      </div>
      <div class="footer-note">Source: Carroll Kickoff sheet, Carroll_Special_Teams_2021_Current.xlsx (262 rows).</div>
    </div></div>`;

  document.getElementById('kkd-shelf').innerHTML = buildFilterPanel('kkd', DEEP_FILTERS, DATA.filters.kickoff);
  wireFilterPanel('kkd', DEEP_FILTERS, render);

  function render() {
    const state = readFilterState('kkd', DEEP_FILTERS);
    const rows = applyFilters(DATA.units.kickoff, state);
    document.getElementById('kkd-summary').textContent = `${rows.length} kickoffs in view`;
    const deepRows = deep(rows);

    setKPI('kkd-tb', pct(rate(deepRows, (r) => r.touchback)), `${deepRows.filter((r) => r.touchback).length}/${deepRows.length} deep kicks`);
    const homeTb = deepRows.filter((r) => r.is_home), awayTb = deepRows.filter((r) => !r.is_home);
    setKPI('kkd-homeaway', `${pct(rate(homeTb, (r) => r.touchback), 0)} / ${pct(rate(awayTb, (r) => r.touchback), 0)}`, 'home / away');
    const byQ = groupBy(deepRows, 'quarter');
    const { key: bestQ, value: bestRate } = bestByGroup(byQ, (g) => rate(g, (r) => r.touchback));
    setKPI('kkd-bestq', bestQ !== null ? `Q${bestQ}` : '—', bestQ !== null ? `${pct(bestRate, 0)} (n=${byQ.get(bestQ).length})` : 'not enough attempts');
    const onsideRows = onside(rows);
    setKPI('kkd-onside', pct(rate(onsideRows, (r) => r.onside_obtained)), `${onsideRows.filter((r) => r.onside_obtained).length}/${onsideRows.length} attempts`);

    const quarters = DATA.filters.kickoff.quarter.filter((q) => byQ.has(q));
    renderBar(document.getElementById('kkd-quarter'), {
      categories: quarters, values: quarters.map((q) => rate(byQ.get(q), (r) => r.touchback)),
      labelFmt: (v) => pct(v, 0), colorFn: () => cssVar('--cat-2'), tooltipExtra: (q) => `${byQ.get(q).length} kicks`,
    });

    const seasons = DATA.filters.kickoff.season.filter((s) => rows.some((r) => r.season === s));
    const byseason = groupBy(deepRows, 'season');
    renderBar(document.getElementById('kkd-retseason'), {
      categories: seasons, values: seasons.map((s) => { const g = byseason.get(s); return g && g.length ? mean(g.map((r) => r.return_length)) : null; }),
      labelFmt: (v) => `${fmt(v, 0)} yds`, colorFn: () => cssVar('--critical'), tooltipExtra: (s) => `${(byseason.get(s) || []).length} kicks`,
    });

    const allSeasons = DATA.filters.kickoff.season;
    // See reopenSeasons() in charts.js -- keeps this heatmap's columns matching
    // the insight text below (Season never narrows it, only Kicker/Quarter do).
    const heatmapDeepRows = deep(reopenSeasons(DATA.units.kickoff, state, allSeasons));
    const kickers = DATA.filters.kickoff.kicker.filter((k) => heatmapDeepRows.some((r) => r.kicker === k));
    renderHeatmap(document.getElementById('kkd-heatmap'), {
      rowLabels: kickers, colLabels: allSeasons,
      cellFor: (kicker, season) => {
        const g = heatmapDeepRows.filter((r) => r.season === season && r.kicker === kicker);
        if (!g.length) return null;
        return { pct: rate(g, (r) => r.touchback), n: g.length, made: g.filter((r) => r.touchback).length };
      },
      title: (kicker, season) => `${kicker}, ${season}`,
    });

    const hashes = HASH_ORDER;
    const byHash = groupBy(deepRows.filter((r) => r.hash_kicked_from), 'hash_kicked_from');
    const hashesPresent = hashes.filter((h) => byHash.has(h));
    if (hashesPresent.length) {
      renderBar(document.getElementById('kkd-hash'), {
        categories: hashesPresent, values: hashesPresent.map((h) => rate(byHash.get(h), (r) => r.touchback)),
        labelFmt: (v) => pct(v, 0), colorFn: () => cssVar('--cat-3'), tooltipExtra: (h) => `${byHash.get(h).length} kicks`,
      });
    } else {
      document.getElementById('kkd-hash').innerHTML = '<div class="data-note">No charted hash data in the current filter (2023 onward only).</div>';
    }

    const scoreBySeason = groupBy(rows, 'season');
    renderBar(document.getElementById('kkd-scoretrend'), {
      categories: seasons, values: seasons.map((s) => mean((scoreBySeason.get(s) || []).map((r) => r.score))),
      labelFmt: (v) => fmt(v, 0), colorFn: (s, v) => (v >= 50 ? cssVar('--good') : cssVar('--critical')),
      tooltipExtra: (s) => `${(scoreBySeason.get(s) || []).length} kicks`,
    });

    const tbody = kickers.map((k) => {
      const kRows = rows.filter((r) => r.kicker === k);
      const kSeasons = [...new Set(kRows.map((r) => r.season))].sort();
      const kDeep = deep(kRows);
      const hangRows = kRows.filter((r) => r.hangtime !== null);
      return `<tr>
        <td class="name">${k}</td>
        <td>${kSeasons.length === 1 ? kSeasons[0] : `${kSeasons[0]}–${kSeasons[kSeasons.length - 1]}`}</td>
        <td>${kRows.length}</td>
        <td>${pct(rate(kDeep, (r) => r.touchback), 0)}</td>
        <td>${pct(rate(kDeep, (r) => r.inside_25), 0)}</td>
        <td>${fmt(mean(kDeep.map((r) => r.total_distance)), 1)} yds</td>
        <td>${fmt(mean(kDeep.map((r) => r.return_length)), 1)} yds</td>
        <td>${fmt(mean(kRows.map((r) => r.score)), 0)}</td>
        <td>${hangRows.length ? fmt(mean(hangRows.map((r) => r.hangtime)), 2) + 's' : '—'}</td>
      </tr>`;
    }).join('');
    document.getElementById('kkd-table-body').innerHTML = tbody || '<tr><td colspan="9" style="text-align:center; color:var(--muted);">No kickers in current filter.</td></tr>';
  }
  render();
}

/* ------------------------------------------------------------------------ tabs ---- */

const TAB_RENDERERS = { exec: execTab, h2h: h2hTab, deep: deepTab };

function showTab(tab) {
  document.querySelectorAll('#kk-tabs .tabbtn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  TAB_RENDERERS[tab](document.getElementById('kk-stage'));
}

document.querySelectorAll('#kk-tabs .tabbtn').forEach((btn) => {
  btn.addEventListener('click', () => showTab(btn.dataset.tab));
});

fetch('../data/special-teams.json')
  .then((r) => r.json())
  .then((data) => { DATA = data; showTab('exec'); })
  .catch((err) => {
    document.getElementById('kk-stage').innerHTML = `<div class="card"><div class="card-body">Couldn't load data/special-teams.json — ${err}. Run scripts/build_special_teams_data.py first, and serve over http:// not file://.</div></div>`;
  });
</script>
