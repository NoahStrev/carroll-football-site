<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rankings — Carroll Football Analytics</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  /* .unit-header, .kpirow, .lb-scroll-wrap/table.lb-scroll, .tag all already
     live in css/theme.css. */
  .rankgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .rankgrid .card-body { padding: 0; }
  .rank-shelf { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 15px; border-bottom: 1px solid var(--grid); flex-wrap: wrap; }
  .rank-scroll { max-height: 480px; overflow-y: auto; padding: 0 15px 13px; }
  table.rank-table thead th { position: sticky; top: 0; z-index: 1; background: var(--page); box-shadow: 0 1px 0 var(--grid); }
  .download-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .download-btn {
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 7px 13px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .download-btn { cursor: pointer; }
  .download-btn:hover { border-color: var(--accent); color: var(--accent); }

  .week-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 15px 10px; }
  .week-tab-btn {
    font-family: inherit; font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); cursor: pointer;
  }
  .week-tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .week-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .print-only { display: none; }

  @media (max-width: 900px) {
    .rankgrid { grid-template-columns: 1fr; }
  }

  /* Each panel's own "PDF" button marks it as .print-target (js) right before
     window.print() -- only that one card (title, current season/week, table)
     survives onto the printed page/PDF, everything else on the site is hidden. */
  @media print {
    .sitenav, .intro, .tabbar, .no-print, select, .week-tabs { display: none !important; }
    /* Only a rankgrid that actually HAS a marked card (the Rankings phase tabs'
       "print just this one panel" case) hides its other card. */
    .rankgrid:has(.print-target) .card:not(.print-target) { display: none !important; }
    .rankgrid { display: block !important; }
    .rank-scroll { max-height: none !important; overflow: visible !important; }
    .print-only { display: inline !important; }
    table.rank-table thead th { position: static; box-shadow: none; }
  }

</style>
</head>
<body>

<div class="page">
  <nav class="sitenav">
    <div class="brand"><span class="mark">CU</span> Carroll Football Analytics</div>
    <div class="links">
      <a href="special-teams-overview.html">Special Teams</a>
      <a href="placekicker.html">Positions</a>
      <a href="lifting-strength.html">Lifting &amp; Strength</a>
      <a href="offense.html">Offense</a>
      <a href="defense.html">Defense</a>
      <a href="opponent-scouting.html">Opponent Scouting</a>
      <a href="rankings.html" class="active">Rankings</a>
      <a href="glossary.html">Glossary</a>
      <a href="updates.html">Updates</a>
    </div>
  </nav>

  <div class="intro">
    <h1>Rankings</h1>
  </div>

  <div class="tabbar" id="rank-tabs">
    <button class="tabbtn active" data-tab="offense">Offensive</button>
    <button class="tabbtn" data-tab="defense">Defensive</button>
    <button class="tabbtn" data-tab="special_teams">Special Teams</button>
    <button class="tabbtn" data-tab="overall">Additional Metrics</button>
  </div>

  <div class="stage" id="rank-stage"></div>
</div>

<script src="../js/charts.js"></script>
<script>
let DATA = null;

const PHASE_TITLES = { overall: 'Additional Metrics', offense: 'Offensive', defense: 'Defensive', special_teams: 'Special Teams' };

function rankTag(rank, outOf) {
  if (rank <= 3) return `<span class="tag good">#${rank} of ${outOf}</span>`;
  if (outOf - rank < 3) return `<span class="tag crit">#${rank} of ${outOf}</span>`;
  return `#${rank} of ${outOf}`;
}

// ranked=true (one season selected): real per-category rank, sorted best-first --
// exactly what the source publishes. ranked=false (All seasons): a rank number
// pulled out of its own year's competitive pool and sorted next to a different
// year's would imply a cross-season comparison neither source actually publishes,
// so this mode drops Rank entirely and just lists each season's real value, most
// recent season first, grouped for browsing rather than ranked.
function cciwTable(rows, ranked) {
  if (!rows.length) return '<div class="lb-empty">No CCIW-scope rows for this selection.</div>';
  if (ranked) {
    const sorted = rows.slice().sort((a, b) => a.rank - b.rank);
    const body = sorted.map((r) => `
    <tr>
      <td class="name">${r.category}</td>
      <td>${r.metric}</td>
      <td style="text-align:right;">${r.value}</td>
      <td style="text-align:right;">${rankTag(r.rank, r.out_of)}</td>
    </tr>`).join('');
    return `
    <table class="mini rank-table">
      <thead><tr><th>Category</th><th>Metric</th><th style="text-align:right;">Value</th><th style="text-align:right;">CCIW Rank</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
  }
  const sorted = rows.slice().sort((a, b) => b.season.localeCompare(a.season) || a.category.localeCompare(b.category));
  const body = sorted.map((r) => `
    <tr>
      <td>${r.season}</td>
      <td class="name">${r.category}</td>
      <td>${r.metric}</td>
      <td style="text-align:right;">${r.value}</td>
    </tr>`).join('');
  return `
    <table class="mini rank-table">
      <thead><tr><th>Season</th><th>Category</th><th>Metric</th><th style="text-align:right;">Value</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

function nationalTable(rows, ranked) {
  if (!rows.length) return '<div class="lb-empty">No National-scope rows for this selection.</div>';
  if (ranked) {
    const sorted = rows.slice().sort((a, b) => a.rank - b.rank);
    const body = sorted.map((r) => `
    <tr>
      <td class="name">${r.category}</td>
      <td>${r.stat}</td>
      <td style="text-align:right;">${r.value}</td>
      <td style="text-align:right;">#${r.rank}</td>
    </tr>`).join('');
    return `
    <table class="mini rank-table">
      <thead><tr><th>Category</th><th>Stat</th><th style="text-align:right;">Value</th><th style="text-align:right;">National Rank</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
  }
  const sorted = rows.slice().sort((a, b) => b.season.localeCompare(a.season) || a.category.localeCompare(b.category));
  const body = sorted.map((r) => `
    <tr>
      <td>${r.season}</td>
      <td class="name">${r.category}</td>
      <td>${r.stat}</td>
      <td style="text-align:right;">${r.value}</td>
    </tr>`).join('');
  return `
    <table class="mini rank-table">
      <thead><tr><th>Season</th><th>Category</th><th>Stat</th><th style="text-align:right;">Value</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

// season === '' means "All seasons": each season's own in-progress weeks are
// collapsed to their latest week so the combined view doesn't show one category
// several times over. A specific season with weekly data needs an explicit week
// (defaults to the latest) since showing every week stacked together would do the
// same thing within a single season.
function prepareRows(rows, season, week) {
  const rowKey = (r) => `${r.season}|${r.phase}|${r.category}|${r.metric ?? r.stat}`;
  if (!season) {
    const latestPerKey = new Map();
    rows.forEach((r) => {
      const existing = latestPerKey.get(rowKey(r));
      if (!existing || (r.week ?? -1) > (existing.week ?? -1)) latestPerKey.set(rowKey(r), r);
    });
    return [...latestPerKey.values()];
  }
  const seasonRows = rows.filter((r) => r.season === season);
  const hasWeeks = seasonRows.some((r) => r.week !== null);
  if (!hasWeeks) return seasonRows;
  const w = week !== null && week !== undefined && week !== '' ? Number(week) : Math.max(...seasonRows.map((r) => r.week));
  return seasonRows.filter((r) => r.week === w);
}

// Defaults to the most recent season (real ranks, true to the source) rather than
// "All seasons" -- that option is still there for browsing everything at once, but
// shouldn't be the first thing landed on since it can't show a rank (see cciwTable).
function seasonSelectHTML(id, seasons) {
  return `<select class="fp-select-inline" id="${id}">${seasons.map((s, i) => `<option value="${s}"${i === 0 ? ' selected' : ''}>${s}</option>`).join('')}<option value="">All seasons</option></select>`;
}

// Appears only for a season with in-season weekly data -- a tab row rather than
// a second dropdown, since picking a week is a first-class view switch (like the
// phase tabs above), not a minor filter tweak.
function weekTabsHTML(id, weeks, activeWeek) {
  if (!weeks || !weeks.length) return '';
  const active = activeWeek != null ? Number(activeWeek) : weeks[weeks.length - 1].week;
  return `<div class="week-tabs" id="${id}">${weeks.map((w) => `<button type="button" class="week-tab-btn${w.week === active ? ' active' : ''}" data-week="${w.week}">Wk${w.week} (${w.date})</button>`).join('')}</div>`;
}

// Isolates one card (see the .rankgrid:has(.print-target) print CSS rule) so its
// sibling card doesn't also print.
function printCard(cardEl, filenameTitle) {
  document.querySelectorAll('.print-target').forEach((el) => el.classList.remove('print-target'));
  cardEl.classList.add('print-target');
  printPage(filenameTitle);
}

// Prints whatever's currently visible in the tab as-is -- no card isolation.
function printPage(filenameTitle) {
  const prevTitle = document.title;
  document.title = filenameTitle;
  window.print();
  document.title = prevTitle;
}

function footerSourceText() {
  const cciw = DATA.generated_from.cciw.join(', ');
  const national = DATA.generated_from.national.join(', ');
  return `CCIW Buddah Report's ${cciw} (cciw.org) and National Buddah Report's ${national} (NCAA.com D3) — all read as-is, not re-scraped by this site.`;
}

function rankingsTab(phase, root) {
  const cciwRows = DATA.cciw.rows.filter((r) => r.phase === phase);
  const nationalRows = DATA.national.rows.filter((r) => r.phase === phase);
  const cciwSeasons = [...new Set(cciwRows.map((r) => r.season))].sort().reverse();
  const nationalSeasons = [...new Set(nationalRows.map((r) => r.season))].sort().reverse();
  const title = PHASE_TITLES[phase];

  root.innerHTML = `
    <div class="frame-wrap active">
      <div class="slide">
        <div class="unit-header">
          <div class="brandmark"><span class="crest">CU</span><h2>${title}</h2></div>
          <div class="sub">CCIW &amp; National Rankings · Carroll Football</div>
        </div>
        <div class="body">
          ${phase === 'overall' ? '<div class="insight" style="margin-bottom:14px;">CCIW-scope has no Additional Metrics category (Turnover Margin, Winning %, Penalties) — cciw.org doesn\'t publish these as their own ranked category the way NCAA.com does. Only National Rankings apply to this tab.</div>' : ''}
          <div class="rankgrid">
            <div class="card" id="${phase}-cciw-card">
              <div class="card-head"><h3>CCIW Rankings <span class="print-only" id="${phase}-cciw-printlabel"></span></h3></div>
              <div class="card-body">
                <div class="rank-shelf">
                  <span class="filters-summary" id="${phase}-cciw-summary"></span>
                  ${cciwSeasons.length ? seasonSelectHTML(`${phase}-cciw-season`, cciwSeasons) : ''}
                  <button type="button" class="download-btn no-print" id="${phase}-cciw-pdf">&#8595; PDF</button>
                </div>
                <div id="${phase}-cciw-week-wrap"></div>
                <div class="rank-scroll" id="${phase}-cciw-table"></div>
              </div>
            </div>
            <div class="card" id="${phase}-national-card">
              <div class="card-head"><h3>National Rankings <span class="print-only" id="${phase}-national-printlabel"></span></h3></div>
              <div class="card-body">
                <div class="rank-shelf">
                  <span class="filters-summary" id="${phase}-national-summary"></span>
                  ${nationalSeasons.length ? seasonSelectHTML(`${phase}-national-season`, nationalSeasons) : ''}
                  <button type="button" class="download-btn no-print" id="${phase}-national-pdf">&#8595; PDF</button>
                </div>
                <div id="${phase}-national-week-wrap"></div>
                <div class="rank-scroll" id="${phase}-national-table"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="footer-note no-print">Source: ${footerSourceText()}</div>
      </div>
    </div>`;

  function renderCciw() {
    const season = document.getElementById(`${phase}-cciw-season`)?.value || '';
    const weekBtn = document.querySelector(`#${phase}-cciw-week-wrap .week-tab-btn.active`);
    const filtered = prepareRows(cciwRows, season, weekBtn ? weekBtn.dataset.week : null);
    document.getElementById(`${phase}-cciw-table`).innerHTML = cciwTable(filtered, !!season);
    document.getElementById(`${phase}-cciw-summary`).textContent = `${filtered.length} rows`;
    document.getElementById(`${phase}-cciw-printlabel`).textContent =
      season ? `— ${season}${weekBtn ? ` · Wk${weekBtn.dataset.week}` : ''}` : '— all seasons (real values only, no cross-year rank)';
  }
  function onCciwSeasonChange() {
    const season = document.getElementById(`${phase}-cciw-season`)?.value || '';
    const weeks = season ? DATA.cciw.weeks[season] : null;
    const wrap = document.getElementById(`${phase}-cciw-week-wrap`);
    wrap.innerHTML = weekTabsHTML(`${phase}-cciw-weektabs`, weeks);
    wrap.querySelectorAll('.week-tab-btn').forEach((btn) => btn.addEventListener('click', () => {
      wrap.querySelectorAll('.week-tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
      renderCciw();
    }));
    renderCciw();
  }
  function renderNational() {
    const season = document.getElementById(`${phase}-national-season`)?.value || '';
    const weekBtn = document.querySelector(`#${phase}-national-week-wrap .week-tab-btn.active`);
    const filtered = prepareRows(nationalRows, season, weekBtn ? weekBtn.dataset.week : null);
    document.getElementById(`${phase}-national-table`).innerHTML = nationalTable(filtered, !!season);
    document.getElementById(`${phase}-national-summary`).textContent = `${filtered.length} rows`;
    document.getElementById(`${phase}-national-printlabel`).textContent =
      season ? `— ${season}${weekBtn ? ` · Wk${weekBtn.dataset.week}` : ''}` : '— all seasons (real values only, no cross-year rank)';
  }
  function onNationalSeasonChange() {
    const season = document.getElementById(`${phase}-national-season`)?.value || '';
    const weeks = season ? DATA.national.weeks[season] : null;
    const wrap = document.getElementById(`${phase}-national-week-wrap`);
    wrap.innerHTML = weekTabsHTML(`${phase}-national-weektabs`, weeks);
    wrap.querySelectorAll('.week-tab-btn').forEach((btn) => btn.addEventListener('click', () => {
      wrap.querySelectorAll('.week-tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
      renderNational();
    }));
    renderNational();
  }

  document.getElementById(`${phase}-cciw-season`)?.addEventListener('change', onCciwSeasonChange);
  document.getElementById(`${phase}-national-season`)?.addEventListener('change', onNationalSeasonChange);
  document.getElementById(`${phase}-cciw-pdf`).addEventListener('click', () =>
    printCard(document.getElementById(`${phase}-cciw-card`), `CCIW Rankings - ${title} - Carroll Football`));
  document.getElementById(`${phase}-national-pdf`).addEventListener('click', () =>
    printCard(document.getElementById(`${phase}-national-card`), `National Rankings - ${title} - Carroll Football`));
  onCciwSeasonChange();
  onNationalSeasonChange();
}

const TAB_RENDERERS = {
  overall: (root) => rankingsTab('overall', root),
  offense: (root) => rankingsTab('offense', root),
  defense: (root) => rankingsTab('defense', root),
  special_teams: (root) => rankingsTab('special_teams', root),
};

function showTab(tab) {
  document.querySelectorAll('#rank-tabs .tabbtn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  TAB_RENDERERS[tab](document.getElementById('rank-stage'));
}

document.querySelectorAll('#rank-tabs .tabbtn').forEach((btn) => {
  btn.addEventListener('click', () => showTab(btn.dataset.tab));
});

fetch('../data/rankings.json')
  .then((r) => r.json())
  .then((data) => {
    DATA = data;
    showTab('offense');
  })
  .catch((err) => {
    document.getElementById('rank-stage').innerHTML = `<div class="card"><div class="card-body">Couldn't load data/rankings.json — ${err}. Run scripts/build_rankings_data.py first, and serve over http:// not file://.</div></div>`;
  });
</script>
</body>
</html>
