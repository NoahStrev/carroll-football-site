<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rankings — Carroll Football Analytics</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  /* .unit-header, .kpirow, .lb-scroll-wrap/table.lb-scroll, .tag all already
     live in css/theme.css. */
  .rankgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .rankgrid .card-body { padding: 0; }
  .rank-shelf { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 15px; border-bottom: 1px solid var(--grid); flex-wrap: wrap; }
  .rank-scroll { max-height: 480px; overflow-y: auto; padding: 0 15px 13px; }
  table.rank-table thead th { position: sticky; top: 0; z-index: 1; background: var(--page); box-shadow: 0 1px 0 var(--grid); }
  .download-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .download-btn {
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 7px 13px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .download-btn:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 900px) {
    .rankgrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page">
  <nav class="sitenav">
    <div class="brand"><span class="mark">CU</span> Carroll Football Analytics</div>
    <div class="links">
      <a href="../index.html">Overview</a>
      <a href="special-teams-overview.html">Special Teams</a>
      <a href="lifting-strength.html">Lifting &amp; Strength</a>
      <a href="offense.html">Offense</a>
      <a href="defense.html">Defense</a>
      <a href="rankings.html" class="active">Rankings</a>
    </div>
  </nav>

  <div class="intro">
    <h1>Rankings</h1>
  </div>

  <div class="tabbar" id="rank-tabs">
    <button class="tabbtn active" data-tab="this_week">This Week</button>
    <button class="tabbtn" data-tab="overall">Overall</button>
    <button class="tabbtn" data-tab="offense">Offensive</button>
    <button class="tabbtn" data-tab="defense">Defensive</button>
    <button class="tabbtn" data-tab="special_teams">Special Teams</button>
  </div>

  <div class="stage" id="rank-stage"></div>
</div>

<script src="../js/charts.js"></script>
<script>
let DATA = null;

const PHASE_TITLES = { overall: 'Overall', offense: 'Offensive', defense: 'Defensive', special_teams: 'Special Teams' };

function rankTag(rank, outOf) {
  if (rank <= 3) return `<span class="tag good">#${rank} of ${outOf}</span>`;
  if (outOf - rank < 3) return `<span class="tag crit">#${rank} of ${outOf}</span>`;
  return `#${rank} of ${outOf}`;
}

function cciwTable(rows) {
  if (!rows.length) return '<div class="lb-empty">No CCIW-scope rows for this selection.</div>';
  const sorted = rows.slice().sort((a, b) => a.rank - b.rank);
  const body = sorted.map((r) => `
    <tr>
      <td class="name">${r.category}</td>
      <td>${r.metric}</td>
      <td style="text-align:right;">${r.value}</td>
      <td style="text-align:right;">${rankTag(r.rank, r.out_of)}</td>
    </tr>`).join('');
  return `
    <table class="mini rank-table">
      <thead><tr><th>Category</th><th>Metric</th><th style="text-align:right;">Value</th><th style="text-align:right;">CCIW Rank</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

function nationalTable(rows) {
  if (!rows.length) return '<div class="lb-empty">No National-scope rows for this selection.</div>';
  const sorted = rows.slice().sort((a, b) => a.rank - b.rank);
  const body = sorted.map((r) => `
    <tr>
      <td class="name">${r.category}</td>
      <td>${r.stat}</td>
      <td style="text-align:right;">${r.value}</td>
      <td style="text-align:right;">#${r.rank}</td>
    </tr>`).join('');
  return `
    <table class="mini rank-table">
      <thead><tr><th>Category</th><th>Stat</th><th style="text-align:right;">Value</th><th style="text-align:right;">National Rank</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

// season === '' means "All seasons": each season's own in-progress weeks are
// collapsed to their latest week so the combined view doesn't show one category
// several times over. A specific season with weekly data needs an explicit week
// (defaults to the latest) since showing every week stacked together would do the
// same thing within a single season.
function prepareRows(rows, season, week) {
  const rowKey = (r) => `${r.season}|${r.phase}|${r.category}|${r.metric ?? r.stat}`;
  if (!season) {
    const latestPerKey = new Map();
    rows.forEach((r) => {
      const existing = latestPerKey.get(rowKey(r));
      if (!existing || (r.week ?? -1) > (existing.week ?? -1)) latestPerKey.set(rowKey(r), r);
    });
    return [...latestPerKey.values()];
  }
  const seasonRows = rows.filter((r) => r.season === season);
  const hasWeeks = seasonRows.some((r) => r.week !== null);
  if (!hasWeeks) return seasonRows;
  const w = week !== null && week !== undefined && week !== '' ? Number(week) : Math.max(...seasonRows.map((r) => r.week));
  return seasonRows.filter((r) => r.week === w);
}

function seasonSelectHTML(id, seasons) {
  return `<select class="fp-select-inline" id="${id}"><option value="">All seasons</option>${seasons.map((s) => `<option value="${s}">${s}</option>`).join('')}</select>`;
}

function weekSelectHTML(id, weeks) {
  if (!weeks || !weeks.length) return '';
  const latest = weeks[weeks.length - 1].week;
  return `<select class="fp-select-inline" id="${id}">${weeks.map((w) => `<option value="${w.week}"${w.week === latest ? ' selected' : ''}>Wk${w.week} (${w.date})</option>`).join('')}</select>`;
}

function downloadRowHTML() {
  return DATA.downloads.map((d) => `<a class="download-btn" href="../data/downloads/${d.file}" download>&#8595; ${d.label}</a>`).join('');
}

function footerSourceText() {
  const cciw = DATA.generated_from.cciw.join(', ');
  const national = DATA.generated_from.national.join(', ');
  return `CCIW Buddah Report's ${cciw} (cciw.org) and National Buddah Report's ${national} (NCAA.com D3) — all read as-is, not re-scraped by this site.`;
}

function rankingsTab(phase, root) {
  const cciwRows = DATA.cciw.rows.filter((r) => r.phase === phase);
  const nationalRows = DATA.national.rows.filter((r) => r.phase === phase);
  const cciwSeasons = [...new Set(cciwRows.map((r) => r.season))].sort().reverse();
  const nationalSeasons = [...new Set(nationalRows.map((r) => r.season))].sort().reverse();
  const title = PHASE_TITLES[phase];

  root.innerHTML = `
    <div class="frame-wrap active">
      <div class="slide">
        <div class="unit-header">
          <div class="brandmark"><span class="crest">CU</span><h2>${title}</h2></div>
          <div class="sub">CCIW &amp; National Rankings · Carroll Football</div>
        </div>
        <div class="body">
          ${phase === 'overall' ? '<div class="insight" style="margin-bottom:14px;">CCIW-scope has no Overall category — see the intro above for why. Only National Rankings apply to this tab.</div>' : ''}
          <div class="rankgrid">
            <div class="card">
              <div class="card-head"><h3>CCIW Rankings</h3></div>
              <div class="card-body">
                <div class="rank-shelf">
                  <span class="filters-summary" id="${phase}-cciw-summary"></span>
                  ${cciwSeasons.length ? seasonSelectHTML(`${phase}-cciw-season`, cciwSeasons) : ''}
                  <span id="${phase}-cciw-week-wrap"></span>
                </div>
                <div class="rank-scroll" id="${phase}-cciw-table"></div>
              </div>
            </div>
            <div class="card">
              <div class="card-head"><h3>National Rankings</h3></div>
              <div class="card-body">
                <div class="rank-shelf">
                  <span class="filters-summary" id="${phase}-national-summary"></span>
                  ${nationalSeasons.length ? seasonSelectHTML(`${phase}-national-season`, nationalSeasons) : ''}
                  <span id="${phase}-national-week-wrap"></span>
                </div>
                <div class="rank-scroll" id="${phase}-national-table"></div>
              </div>
            </div>
          </div>
          <div class="download-row">${downloadRowHTML()}</div>
        </div>
        <div class="footer-note">Source: ${footerSourceText()}</div>
      </div>
    </div>`;

  function renderCciw() {
    const season = document.getElementById(`${phase}-cciw-season`)?.value || '';
    const weekSel = document.getElementById(`${phase}-cciw-week`);
    const filtered = prepareRows(cciwRows, season, weekSel ? weekSel.value : null);
    document.getElementById(`${phase}-cciw-table`).innerHTML = cciwTable(filtered);
    document.getElementById(`${phase}-cciw-summary`).textContent = `${filtered.length} rows`;
  }
  function onCciwSeasonChange() {
    const season = document.getElementById(`${phase}-cciw-season`)?.value || '';
    const weeks = season ? DATA.cciw.weeks[season] : null;
    const wrap = document.getElementById(`${phase}-cciw-week-wrap`);
    wrap.innerHTML = weekSelectHTML(`${phase}-cciw-week`, weeks);
    document.getElementById(`${phase}-cciw-week`)?.addEventListener('change', renderCciw);
    renderCciw();
  }
  function renderNational() {
    const season = document.getElementById(`${phase}-national-season`)?.value || '';
    const weekSel = document.getElementById(`${phase}-national-week`);
    const filtered = prepareRows(nationalRows, season, weekSel ? weekSel.value : null);
    document.getElementById(`${phase}-national-table`).innerHTML = nationalTable(filtered);
    document.getElementById(`${phase}-national-summary`).textContent = `${filtered.length} rows`;
  }
  function onNationalSeasonChange() {
    const season = document.getElementById(`${phase}-national-season`)?.value || '';
    const weeks = season ? DATA.national.weeks[season] : null;
    const wrap = document.getElementById(`${phase}-national-week-wrap`);
    wrap.innerHTML = weekSelectHTML(`${phase}-national-week`, weeks);
    document.getElementById(`${phase}-national-week`)?.addEventListener('change', renderNational);
    renderNational();
  }

  document.getElementById(`${phase}-cciw-season`)?.addEventListener('change', onCciwSeasonChange);
  document.getElementById(`${phase}-national-season`)?.addEventListener('change', onNationalSeasonChange);
  onCciwSeasonChange();
  onNationalSeasonChange();
}

function joinTeamRows(carrollRows, opponentRows, keyFn) {
  const oppMap = new Map(opponentRows.map((r) => [keyFn(r), r]));
  const seen = new Set();
  const joined = [];
  carrollRows.forEach((cr) => {
    const key = keyFn(cr);
    seen.add(key);
    joined.push({ ...cr, opponentRow: oppMap.get(key) || null });
  });
  opponentRows.forEach((or) => {
    const key = keyFn(or);
    if (seen.has(key)) return;
    joined.push({ category: or.category, metric: or.metric, stat: or.stat, rank: null, out_of: null, opponentRow: or });
  });
  return joined;
}

function thisWeekTable(joined, isNational) {
  if (!joined.length) return '<div class="lb-empty">No rows for this selection.</div>';
  const sorted = joined.slice().sort((a, b) => {
    const ak = a.category + (a.metric ?? a.stat ?? ''), bk = b.category + (b.metric ?? b.stat ?? '');
    return ak.localeCompare(bk);
  });
  const body = sorted.map((r) => {
    const metricLabel = r.metric ?? r.stat ?? '';
    const carrollCell = r.rank != null ? (isNational ? `#${r.rank}` : rankTag(r.rank, r.out_of)) : '—';
    const oppCell = r.opponentRow ? (isNational ? `#${r.opponentRow.rank}` : rankTag(r.opponentRow.rank, r.opponentRow.out_of)) : '—';
    return `
    <tr>
      <td class="name">${r.category}</td>
      <td>${metricLabel}</td>
      <td style="text-align:right;">${carrollCell}</td>
      <td style="text-align:right;">${oppCell}</td>
    </tr>`;
  }).join('');
  return `
    <table class="mini rank-table">
      <thead><tr><th>Category</th><th>Metric</th><th style="text-align:right;">Carroll</th><th style="text-align:right;">Opponent</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

function thisWeekTab(root) {
  const tw = DATA.this_week;
  if (!tw) {
    root.innerHTML = `
      <div class="frame-wrap active">
        <div class="slide">
          <div class="unit-header"><div class="brandmark"><span class="crest">CU</span><h2>This Week</h2></div></div>
          <div class="body"><div class="insight">No schedule data yet — run <code>Schedule/scrape_schedule.py</code>, or the 2026 season is fully played out.</div></div>
        </div>
      </div>`;
    return;
  }

  const haLabel = tw.home_away === 'home' ? 'vs.' : tw.home_away === 'away' ? 'at' : '';
  const confLabel = tw.is_conference ? 'CCIW conference game' : 'non-conference game';
  const whenWhere = [
    tw.date_text, tw.time_text,
    [tw.venue, tw.city].filter(Boolean).join(', '),
  ].filter(Boolean).join(' · ');

  const phases = ['overall', 'offense', 'defense', 'special_teams'];
  const panelsHTML = phases.map((phase) => {
    const carrollCciw = tw.carroll.cciw.rows.filter((r) => r.phase === phase);
    const carrollNat = tw.carroll.national.rows.filter((r) => r.phase === phase);
    const oppCciw = tw.opponent_rows.cciw.rows.filter((r) => r.phase === phase);
    const oppNat = tw.opponent_rows.national.rows.filter((r) => r.phase === phase);
    const cciwJoined = joinTeamRows(carrollCciw, oppCciw, (r) => `${r.category}|${r.metric}`);
    const natJoined = joinTeamRows(carrollNat, oppNat, (r) => `${r.category}|${r.stat}`);
    return `
      <h3 style="margin:18px 0 8px;">${PHASE_TITLES[phase]}</h3>
      <div class="rankgrid">
        <div class="card">
          <div class="card-head"><h3>CCIW Rankings${tw.carroll.cciw.season ? ` (${tw.carroll.cciw.season})` : ''}</h3></div>
          <div class="card-body"><div class="rank-scroll">${phase === 'overall' ? '<div class="lb-empty">CCIW-scope has no Overall category.</div>' : thisWeekTable(cciwJoined, false)}</div></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>National Rankings${tw.carroll.national.season ? ` (${tw.carroll.national.season})` : ''}</h3></div>
          <div class="card-body"><div class="rank-scroll">${thisWeekTable(natJoined, true)}</div></div>
        </div>
      </div>`;
  }).join('');

  root.innerHTML = `
    <div class="frame-wrap active">
      <div class="slide">
        <div class="unit-header">
          <div class="brandmark"><span class="crest">CU</span><h2>This Week</h2></div>
          <div class="sub">${haLabel} ${tw.opponent} · ${whenWhere} · ${confLabel}</div>
        </div>
        <div class="body">
          ${!tw.opponent_data_available ? `<div class="insight">No ranking data available for ${tw.opponent} — not tracked by either CCIW Buddah Report or National Buddah Report (non-conference opponent). Carroll's own current standing is shown below regardless.</div>` : ''}
          ${panelsHTML}
        </div>
        <div class="footer-note">Schedule: Schedule/schedule.json (gopios.com). Ranks: most current season/week available for each team from the same sources as the tabs after this one.</div>
      </div>
    </div>`;
}

const TAB_RENDERERS = {
  this_week: (root) => thisWeekTab(root),
  overall: (root) => rankingsTab('overall', root),
  offense: (root) => rankingsTab('offense', root),
  defense: (root) => rankingsTab('defense', root),
  special_teams: (root) => rankingsTab('special_teams', root),
};

function showTab(tab) {
  document.querySelectorAll('#rank-tabs .tabbtn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  TAB_RENDERERS[tab](document.getElementById('rank-stage'));
}

document.querySelectorAll('#rank-tabs .tabbtn').forEach((btn) => {
  btn.addEventListener('click', () => showTab(btn.dataset.tab));
});

fetch('../data/rankings.json')
  .then((r) => r.json())
  .then((data) => {
    DATA = data;
    showTab('this_week');
  })
  .catch((err) => {
    document.getElementById('rank-stage').innerHTML = `<div class="card"><div class="card-body">Couldn't load data/rankings.json — ${err}. Run scripts/build_rankings_data.py first, and serve over http:// not file://.</div></div>`;
  });
</script>
</body>
</html>
