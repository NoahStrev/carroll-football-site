<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opponent Scouting — Carroll Football Analytics</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  /* .unit-header, .kpirow, .tabbar/.tabbtn all already live in css/theme.css. */
  .scout-select {
    font-family: inherit; font-size: 12.5px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--page); color: var(--text-primary); font-weight: 600;
  }
  .scout-report-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .scout-section-title { font-size: 15px; font-weight: 800; margin: 22px 0 10px; }
  .scout-section-title:first-child { margin-top: 0; }
  /* Same shape as offense.html/defense.html's own local .chartgrid -- not a
     shared theme.css class (each page re-declares it alongside its own
     breakpoint, see theme.css's responsive-section comment). */
  .chartgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .chartgrid .card-body { min-height: 190px; }
  @media (max-width: 900px) {
    .chartgrid { grid-template-columns: 1fr; }
  }
  /* Scouting Report's scenario table -- 9 columns (Scenario, N, 2 Play Type,
     3 Direction, 2 Pass Depth) is wider than most .mini tables on this site,
     and can run 50+ rows long (per the user: "the header isn't visible
     making it hard to remember"). Real bug found getting a sticky header
     working here: `overflow-x: auto` on ANY ancestor -- .tbl-scroll itself,
     or even theme.css's shared .stage two levels up, which every dashboard's
     tab content sits inside -- forces that ancestor's overflow-y to compute
     to `auto` too per the CSS overflow spec (an author can't override this
     back to `visible` while overflow-x stays non-visible; the browser
     ignores it). That silently makes the ancestor a scroll container even
     though it never actually overflows (its own height always matches its
     content), which is enough to become position:sticky's positioning
     context instead of the real page -- and since that container's own
     scrollTop never moves, the "sticky" header just sits frozen in place
     instead of tracking the viewport as the page scrolls past it.
     Fix: give .tbl-scroll a real bounded height instead of fighting that
     cascade rule -- once it's a genuine, always-scrolling box (scrollHeight
     > clientHeight whenever the table is tall), it's unambiguously its own
     header's sticky context regardless of what .stage or anything else does,
     and it now also scrolls vertically within itself (a conventional
     frozen-header data-table pattern) rather than the whole page scrolling
     past a sticky bar. .tbl-section rows are a group header (a bare colspan
     row, no data) between each scenario dimension (By Down, By Quarter,
     ...). */
  .tbl-scroll { overflow: auto; max-height: 65vh; }
  table.mini .tbl-section td {
    background: var(--page); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); font-weight: 700; padding-top: 12px;
  }
  table.mini.scenario-table thead th {
    position: sticky; top: 0; z-index: 2; background: var(--page); box-shadow: 0 1px 0 var(--grid);
  }
  /* Real UX gap found 2026-08-05 (screen-size scroll audit): this table's
     9 columns (7 for the scheme tables) don't fit inside ~294px of usable
     width on a phone (390px viewport) -- the table needs to scroll
     horizontally too, but with no sticky first column, scrolling right to
     see the Direction/Pass Depth (or Top Front/Blitz/...) columns lost the
     "Scenario" row label off the left edge, making it unclear which row's
     percentages you were reading. Sticking the first column, the same way
     the header row already sticks vertically, keeps the row label in view
     during horizontal scroll. .tbl-section's own colspan group-header row
     is excluded (`tr:not(.tbl-section)`) -- its one cell already spans the
     full table width, so pinning just its left edge would be a no-op at
     best and visually odd at worst. */
  table.mini.scenario-table tbody tr:not(.tbl-section) td:first-child {
    position: sticky; left: 0; z-index: 1; background: var(--page); box-shadow: 1px 0 0 var(--grid);
  }
  table.mini.scenario-table thead th:first-child {
    left: 0; z-index: 3; box-shadow: 1px 0 0 var(--grid), 0 1px 0 var(--grid);
  }
  .download-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .download-btn {
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 7px 13px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .download-btn:hover { border-color: var(--accent); color: var(--accent); }
  .custom-situation-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .custom-situation-grid label {
    display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); font-weight: 700; margin-bottom: 4px;
  }
  .custom-situation-grid .scout-select { width: 100%; }
  .modal-pct { color: var(--muted); font-size: 11px; font-weight: 400; }

  @media print {
    .sitenav, .intro, .tabbar, .no-print, .scout-report-head select, .filters-control, .filters-summary { display: none !important; }
    table.mini.scenario-table thead th { position: static; box-shadow: none; }
    /* The sticky-first-column rules above are each more specific than the
       thead th reset just above (:first-child adds a specificity point),
       so they need their own explicit print reset rather than relying on
       that one rule to cover them too. */
    table.mini.scenario-table thead th:first-child,
    table.mini.scenario-table tbody tr:not(.tbl-section) td:first-child {
      position: static; box-shadow: none;
    }
    /* .tbl-scroll's max-height/overflow is a screen-only convenience (frozen
       header while scanning on-screen) -- printed, the table should lay out
       in full across as many pages as it needs, not clip to one scrolled
       screenful. */
    .tbl-scroll { max-height: none; overflow: visible; }
  }
</style>
</head>
<body>

<div class="page">
  <nav class="sitenav">
    <div class="brand"><span class="mark">CU</span> Carroll Football Analytics</div>
    <div class="links">
      <a href="special-teams-overview.html">Special Teams</a>
      <a href="placekicker.html">Positions</a>
      <a href="lifting-strength.html">Lifting &amp; Strength</a>
      <a href="offense.html">Offense</a>
      <a href="defense.html">Defense</a>
      <a href="opponent-scouting.html" class="active">Opponent Scouting</a>
      <a href="rankings.html">Rankings</a>
      <a href="glossary.html">Glossary</a>
      <a href="updates.html">Updates</a>
    </div>
  </nav>

  <div class="intro">
    <h1>Opponent Scouting</h1>
  </div>

  <div class="tabbar" id="os-tabs">
    <button class="tabbtn active" data-tab="by_opponent">By Opponent</button>
    <button class="tabbtn" data-tab="offense_self_scout">Offense Self Scout</button>
    <button class="tabbtn" data-tab="offense_scout">Offense Scout</button>
    <button class="tabbtn" data-tab="defense_self_scout">Defense Self Scout</button>
    <button class="tabbtn" data-tab="defense_scout">Defense Scout</button>
  </div>

  <div class="stage" id="os-stage"></div>
</div>

<script src="../js/charts.js"></script>
<script>
let DATA = null;
const QUARTERS = ['1st', '2nd', '3rd', '4th', 'OT'];

// Rush/Pass/Sack/Kneel/Two-Point Conversion is official play-by-play's full
// play_type vocabulary (see offense.html/defense.html) -- Kneel and Two-Point
// Conversion snaps aren't real play-calling signal (clock-killing, a distinct
// situational play), so they're dropped from every run/pass split below. Sack
// counts as a pass call, the same convention Offense > Quarterbacks already
// documents ("Sack -> Pass is the standard stat-keeping convention").
function runPassRows(rows) { return rows.filter((r) => r.play_type === 'Rush' || r.play_type === 'Pass' || r.play_type === 'Sack'); }
function isRunPlay(r) { return r.play_type === 'Rush'; }
function isPassPlay(r) { return r.play_type === 'Pass' || r.play_type === 'Sack'; }

// Same pattern as rankings.html's printPage() -- prints whatever's currently
// visible in the tab as-is (print CSS above hides the nav/tabbar/controls),
// no per-card isolation needed since each tab here is already just one
// self-contained report.
function printPage(filenameTitle) {
  const prevTitle = document.title;
  document.title = filenameTitle;
  window.print();
  document.title = prevTitle;
}

// Per the user (2026-08-04): "make it able to use the combined data of all
// teams, along with another filter which will be a checkbox of what years to
// select, have the default be all years" -- added to all 4 per-opponent tabs
// (Offense Self Scout, Offense Scout, Defense Self Scout, Defense Scout).
// ALL_OPPONENTS is a sentinel value for each tab's Opponent <select> meaning
// "don't filter by opponent at all" -- every real opponent is a plain team
// name, never this literal, so it can't collide. The Season filter reuses the
// exact same checkbox filter-panel component (buildFilterPanel/wireFilterPanel/
// readFilterState) the By Opponent tab already uses; defaultLatestOnly is left
// unset here (unlike By Opponent's own Season filter) so every season starts
// checked, per the user's explicit "default be all years."
const ALL_OPPONENTS = '__ALL__';
const ALL_OPPONENTS_LABEL = 'All Opponents (Combined)';
const YEAR_FILTERS = [{ field: 'season', label: 'Season' }];

function filterByOpponentSeason(rows, opponent, seasonSet) {
  return rows.filter((r) => (opponent === ALL_OPPONENTS || r.opponent === opponent) && seasonSet.has(String(r.season)));
}

function byOpponentMetrics(rows) {
  const withEff = rows.filter((r) => r.play_efficiency !== null);
  return {
    ypp: mean(rows.map((r) => r.yards)),
    success: rate(withEff, (r) => isSuccess(r.play_efficiency)),
    explosive: rate(withEff, (r) => r.play_efficiency === 'Explosive'),
    turnover: rate(rows, (r) => r.is_turnover),
  };
}

/* ============================================================================
   BY OPPONENT
   ============================================================================ */

// defaultLatestOnly removed 2026-08-05, per the user ("for the opponent
// scouting tab have the default be all years selected") -- this tab's own
// Season filter used to follow the site-wide "preset to most recent year"
// convention (see js/charts.js's own defaultLatestOnly comment), but that's
// now inconsistent with the other 4 Opponent Scouting tabs, which already
// default to every season checked per an earlier, more specific instruction
// for this page. Every other page's Season filter is untouched -- this is
// scoped to Opponent Scouting only, not a site-wide convention change.
const BO_FILTERS = [{ field: 'season', label: 'Season' }];

function byOpponentTab(root) {
  root.innerHTML = `
    <div class="frame-wrap active">
      <div class="slide">
        <div class="unit-header">
          <div class="brandmark"><span class="crest">CU</span><h2>Opponent Scouting</h2></div>
          <div class="sub">By Opponent · Official Play-by-Play</div>
        </div>
        <div class="shelf" id="bo-shelf"></div>
        <div class="body">
          <div class="download-row no-print">
            <button type="button" class="download-btn" id="bo-pdf">&#8595; PDF</button>
          </div>
          <h3 class="scout-section-title">Offense</h3>
          <div class="chartgrid">
            <div class="card"><div class="card-head"><h3>Yards / Play by Opponent</h3></div><div class="card-body" id="bo-off-ypp"></div></div>
            <div class="card"><div class="card-head"><h3>Success Rate by Opponent</h3></div><div class="card-body" id="bo-off-succ"></div></div>
            <div class="card"><div class="card-head"><h3>Explosive Rate by Opponent</h3></div><div class="card-body" id="bo-off-exp"></div></div>
            <div class="card"><div class="card-head"><h3>Turnover Rate by Opponent</h3></div><div class="card-body" id="bo-off-to"></div></div>
          </div>
          <h3 class="scout-section-title">Defense</h3>
          <div class="chartgrid">
            <div class="card"><div class="card-head"><h3>Yards Allowed / Play by Opponent</h3></div><div class="card-body" id="bo-def-ypp"></div></div>
            <div class="card"><div class="card-head"><h3>Success Rate Allowed by Opponent</h3></div><div class="card-body" id="bo-def-succ"></div></div>
            <div class="card"><div class="card-head"><h3>Explosive Rate Allowed by Opponent</h3></div><div class="card-body" id="bo-def-exp"></div></div>
            <div class="card"><div class="card-head"><h3>Takeaway Rate by Opponent</h3></div><div class="card-body" id="bo-def-to"></div></div>
          </div>
        </div>
        <div class="footer-note">Source: Game Analysis's OfficialPlayByPlay sheet, combined_play_data.xlsx (50 real Carroll games, 2021–2025).</div>
      </div>
    </div>`;

  document.getElementById('bo-shelf').innerHTML = buildFilterPanel('bo', BO_FILTERS, DATA.filters.offense);
  wireFilterPanel('bo', BO_FILTERS, render);

  // scroll: true -- per the user ("we need to be able to scroll left and
  // right because there are too many teams"), these charts stopped
  // flex-shrinking every opponent to fit the card (unreadable past ~8-10
  // categories) and scroll horizontally within their own card instead.
  function renderOpponentGrainCharts(side, rows, toColorVar) {
    const byOpp = groupBy(rows, 'opponent');
    const opponents = [...byOpp.keys()].sort();
    const metrics = new Map(opponents.map((o) => [o, byOpponentMetrics(byOpp.get(o))]));
    renderBar(document.getElementById(`bo-${side}-ypp`), {
      categories: opponents, values: opponents.map((o) => metrics.get(o).ypp),
      labelFmt: (v) => fmt(v, 1), colorFn: () => cssVar('--cat-1'), tooltipExtra: (o) => `${byOpp.get(o).length} plays`, scroll: true,
    });
    renderBar(document.getElementById(`bo-${side}-succ`), {
      categories: opponents, values: opponents.map((o) => metrics.get(o).success),
      labelFmt: (v) => pct(v, 0), colorFn: () => cssVar('--serious'), tooltipExtra: (o) => `${byOpp.get(o).length} plays`, scroll: true,
    });
    renderBar(document.getElementById(`bo-${side}-exp`), {
      categories: opponents, values: opponents.map((o) => metrics.get(o).explosive),
      labelFmt: (v) => pct(v, 0), colorFn: () => cssVar('--cat-8'), tooltipExtra: (o) => `${byOpp.get(o).length} plays`, scroll: true,
    });
    renderBar(document.getElementById(`bo-${side}-to`), {
      categories: opponents, values: opponents.map((o) => metrics.get(o).turnover),
      labelFmt: (v) => pct(v, 0), colorFn: () => cssVar(toColorVar), tooltipExtra: (o) => `${byOpp.get(o).length} plays`, scroll: true,
    });
  }

  document.getElementById('bo-pdf').addEventListener('click', () => printPage('Opponent Scouting - By Opponent - Carroll Football'));

  function render() {
    const state = readFilterState('bo', BO_FILTERS);
    const offRows = applyFilters(DATA.offense.official, state);
    const defRows = applyFilters(DATA.defense.official, state);
    document.getElementById('bo-summary').textContent = `${offRows.length} offensive / ${defRows.length} defensive plays in view`;
    renderOpponentGrainCharts('off', offRows, '--critical');
    renderOpponentGrainCharts('def', defRows, '--good');
  }
  render();
}

/* ============================================================================
   SCOUTING REPORT -- one opponent at a time by design, per the user: a coach
   on the sideline hits a specific scenario, looks it up, and reads the real
   percentage odds for it -- which only makes sense for one team at a time,
   not two overlaid. Originally a handful of Run/Pass bar charts (by down, by
   quarter, after an explosive play); per the user, rebuilt as a single dense
   reference table instead ("a table view with percentages of a bunch of
   different scenarios... play type or call or whatnot") covering every
   scenario dimension the official play-by-play actually has, not just the
   3 examples first mentioned.
   ============================================================================ */

// Leading/trailing by more than a score (8 points -- the real "still has to
// go for it" line: two scores down is a fundamentally different situation
// than one) vs by a score or less vs tied.
const SCORE_BUCKETS = ['Leading by 9+', 'Leading by 1-8', 'Tied', 'Trailing by 1-8', 'Trailing by 9+'];
function scoreBucket(sd) {
  if (sd === null || sd === undefined) return null;
  if (sd > 8) return 'Leading by 9+';
  if (sd > 0) return 'Leading by 1-8';
  if (sd === 0) return 'Tied';
  if (sd >= -8) return 'Trailing by 1-8';
  return 'Trailing by 9+';
}
function ordinalDown(d) { return d === 1 ? '1st' : d === 2 ? '2nd' : d === 3 ? '3rd' : '4th'; }

// Relies on the source array already being in chronological play order
// (true throughout this dataset -- see uniqueByKey's comment on the same
// assumption) since there's no explicit play-sequence field to sort by.
// Flags whether the play immediately before it in the same drive was
// Explosive, and whether it's the first play of its drive (its own real
// scenario: "what do they do to start a drive" is a different question than
// "what do they do on 2nd and 8", not covered by any of down/quarter/
// situation/field zone/distance alone).
function withScenarioFlags(rows) {
  const flagged = [];
  groupBy(rows, 'game_label').forEach((gameRows) => {
    groupBy(gameRows, 'drive_num').forEach((driveRows) => {
      driveRows.forEach((r, i) => {
        flagged.push({
          ...r,
          _afterExplosive: i > 0 && driveRows[i - 1].play_efficiency === 'Explosive',
          _firstPlayOfDrive: i === 0,
        });
      });
    });
  });
  // Real bug found 2026-08-04, caught cross-checking the new "All Opponents"
  // combined view against a raw Python count (1327 shown vs 1329 real 1st-down
  // Run/Pass/Sack snaps): groupBy() silently skips any row whose grouping key
  // is null/undefined -- correct for a real categorical breakdown, but wrong
  // here, since a handful of real snaps have no charted drive_num at all (4
  // rows in offense.official's 2021 Benedictine game, 10 in defense.official's
  // 2021 WashU game -- a charting gap, not real "no drive" plays). Losing them
  // in the grouping above silently excludes them from the ENTIRE scenario
  // table and Custom Situation builder, not just the one Drive Context section
  // that actually needs drive_num to mean anything. Add them back with a
  // default (not fabricated) drive-sequence flag instead of dropping them.
  rows.forEach((r) => {
    if (r.game_label === null || r.game_label === undefined || r.drive_num === null || r.drive_num === undefined) {
      flagged.push({ ...r, _afterExplosive: false, _firstPlayOfDrive: false });
    }
  });
  return flagged;
}

// Every scenario dimension the official play-by-play actually carries, each
// its own section in the report table. `rows` on each item is NOT yet
// filtered to Run/Pass/Sack -- scenarioRowHTML() does that itself so empty
// buckets (e.g. a down/distance combo with zero real snaps) can be dropped
// before rendering.
function buildScenarios(flagged) {
  const withDist = flagged.map((r) => ({ ...r, _db: distanceBucket(r.distance) }));
  return [
    { title: 'By Down', items: DOWNS.map((d) => ({ label: `${ordinalDown(d)} Down`, rows: flagged.filter((r) => r.down === d) })) },
    { title: 'By Distance', items: DIST_BUCKETS.map((b) => ({ label: `${b} yds to go`, rows: withDist.filter((r) => r._db === b) })) },
    {
      title: 'By Down & Distance',
      items: DOWNS.flatMap((d) => DIST_BUCKETS.map((b) => ({ label: `${ordinalDown(d)} & ${b}`, rows: withDist.filter((r) => r.down === d && r._db === b) }))),
    },
    { title: 'By Quarter', items: QUARTERS.map((q) => ({ label: q, rows: flagged.filter((r) => r.quarter === q) })) },
    { title: 'By Situation', items: SITUATIONS.map((s) => ({ label: s, rows: flagged.filter((r) => r.situation === s) })) },
    { title: 'By Field Zone', items: FIELD_ZONES.map((z) => ({ label: z, rows: flagged.filter((r) => r.field_zone === z) })) },
    {
      title: 'Goal-to-Go',
      items: [
        { label: 'Goal-to-Go', rows: flagged.filter((r) => r.is_goal_to_go) },
        { label: 'Not Goal-to-Go', rows: flagged.filter((r) => !r.is_goal_to_go) },
      ],
    },
    { title: 'By Score Situation', items: SCORE_BUCKETS.map((b) => ({ label: b, rows: flagged.filter((r) => scoreBucket(r.score_differential) === b) })) },
    {
      title: 'Drive Context',
      items: [
        { label: 'First Play of Drive', rows: flagged.filter((r) => r._firstPlayOfDrive) },
        { label: 'Not First Play of Drive', rows: flagged.filter((r) => !r._firstPlayOfDrive) },
      ],
    },
    {
      title: 'Explosive-Play Context',
      items: [
        { label: 'After an Explosive Play', rows: flagged.filter((r) => r._afterExplosive) },
        { label: 'Other Snaps', rows: flagged.filter((r) => !r._afterExplosive) },
      ],
    },
    {
      // Added 2026-08-05, per the user asking for more Custom Situation
      // filters. is_two_minute_drill is computed in build_game_data.py from
      // DRIVE_CLOCK (a field this pipeline never read before) -- 2:00 or
      // less on the clock in a half-ending quarter (2nd/4th), the real
      // hurry-up signal a sideline coach cares about. OT excluded (untimed
      // downs, no running clock).
      title: 'Clock Situation',
      items: [
        { label: 'Two-Minute Drill', rows: flagged.filter((r) => r.is_two_minute_drill) },
        { label: 'Other Snaps', rows: flagged.filter((r) => !r.is_two_minute_drill) },
      ],
    },
  ];
}

// One row = one scenario, every "type of call" percentage the data can
// answer for it: Run/Pass mix (of every Run/Pass/Sack snap in the scenario),
// Direction (of just the subset with a charted direction), Pass Depth (of
// just the pass attempts with a charted depth) -- three different
// denominators in one row on purpose, so a coach reads one line for "3rd &
// Long" and gets the full picture instead of hunting across 3 separate tables.
// First Down/Success/Explosive % added 2026-08-05, per the user ("add some
// more percentages... things like got first down, explosive play"). All
// three are of the SAME rp (Run/Pass/Sack) denominator as Run%/Pass% --
// is_first_down/play_efficiency are both official-play-by-play-only fields,
// always populated for a real scrimmage snap (unlike direction/pass_depth,
// which are their own charted subsets with a "—" for uncharted). Only safe
// to compute this way on the OFFICIAL data these report tabs use -- the
// hand-charted Plays sheet's own PLAY_OUTCOME uses a "1st DN" tag that's
// NEVER combined with Rush/Complete/etc (confirmed: 64/64 occurrences are a
// bare standalone tag), so a first-down achieved on a play charted as
// "Rush"/"Complete" has no marker at all there -- deriving a First Down %
// from that field would silently undercount real first downs, unlike this
// field's clean, purpose-built IS_FIRST_DOWN boolean. That's why the scheme
// tabs (schemeScenarioRowHTML, below) only add Success/Explosive %, not
// First Down % -- see schemeScenarioRowHTML's own comment.
function scenarioRowHTML(label, rows) {
  const rp = runPassRows(rows);
  const n = rp.length;
  const runN = rp.filter(isRunPlay).length;
  const passRows = rp.filter(isPassPlay);
  const dirRows = rp.filter((r) => r.direction);
  const left = dirRows.filter((r) => r.direction === 'Left').length;
  const mid = dirRows.filter((r) => r.direction === 'Middle').length;
  const right = dirRows.filter((r) => r.direction === 'Right').length;
  const depthRows = passRows.filter((r) => r.pass_depth);
  const deep = depthRows.filter((r) => r.pass_depth === 'Deep').length;
  const short = depthRows.filter((r) => r.pass_depth === 'Short').length;
  const firstDownN = rp.filter((r) => r.is_first_down).length;
  const successN = rp.filter((r) => isSuccess(r.play_efficiency)).length;
  const explosiveN = rp.filter((r) => r.play_efficiency === 'Explosive').length;
  return `<tr>
    <td class="name">${label}</td>
    <td>${n}</td>
    <td>${pct(n ? runN / n : null, 0)}</td>
    <td>${pct(n ? (n - runN) / n : null, 0)}</td>
    <td>${dirRows.length ? pct(left / dirRows.length, 0) : '—'}</td>
    <td>${dirRows.length ? pct(mid / dirRows.length, 0) : '—'}</td>
    <td>${dirRows.length ? pct(right / dirRows.length, 0) : '—'}</td>
    <td>${depthRows.length ? pct(deep / depthRows.length, 0) : '—'}</td>
    <td>${depthRows.length ? pct(short / depthRows.length, 0) : '—'}</td>
    <td>${pct(n ? firstDownN / n : null, 0)}</td>
    <td>${pct(n ? successN / n : null, 0)}</td>
    <td>${pct(n ? explosiveN / n : null, 0)}</td>
  </tr>`;
}

function sectionRowHTML(title, colspan = 12) {
  return `<tr class="tbl-section"><td colspan="${colspan}">${title}</td></tr>`;
}

function renderScenarioTable(containerId, flagged) {
  const sections = buildScenarios(flagged);
  let rowsHTML = '';
  sections.forEach((sec) => {
    const items = sec.items.filter((it) => runPassRows(it.rows).length > 0);
    if (!items.length) return;
    rowsHTML += sectionRowHTML(sec.title);
    items.forEach((it) => { rowsHTML += scenarioRowHTML(it.label, it.rows); });
  });
  // Real gap found 2026-08-04, while double-checking the new Season filter:
  // picking a single-season opponent (e.g. Benedictine, 2021 only) and
  // unchecking that season is a completely normal path through the new
  // filter, not an edge case -- it used to render a bare header-only table
  // with no rows, which reads like a rendering glitch rather than "no data
  // in this combination." wireCustomSituation() already had a proper empty
  // message for the exact same situation; this matches that.
  if (!rowsHTML) {
    document.getElementById(containerId).innerHTML = '<div class="insight">No real Run/Pass/Sack snaps match the selected opponent(s)/season(s).</div>';
    return;
  }
  document.getElementById(containerId).innerHTML = `
    <div class="tbl-scroll">
      <table class="mini scenario-table">
        <thead>
          <tr><th>Scenario</th><th>N</th><th>Run %</th><th>Pass %</th><th>Dir: Left %</th><th>Dir: Mid %</th><th>Dir: Right %</th><th>Depth: Deep %</th><th>Depth: Short %</th><th>1st Down %</th><th>Success %</th><th>Explosive %</th></tr>
        </thead>
        <tbody>${rowsHTML}</tbody>
      </table>
    </div>`;
}

/* ---------------------------------------------------------------- custom
   situation builder -- per the user: "a custom situation enterer, where
   they can input all the current criteria and get all of the percentages."
   Every dropdown defaults to "Any" (ignored); selected values combine with
   AND. Reuses scenarioRowHTML() so the single result row is the exact same
   Play Type/Direction/Pass Depth shape as every row in the scenario table
   above it, just for whatever exact combination the coach picked instead of
   a pre-built scenario. */
const CUSTOM_FIELDS = [
  { id: 'down', label: 'Down', options: DOWNS.map(String) },
  { id: 'distance', label: 'Distance', options: DIST_BUCKETS },
  { id: 'quarter', label: 'Quarter', options: QUARTERS },
  { id: 'situation', label: 'Situation', options: SITUATIONS },
  { id: 'fieldZone', label: 'Field Zone', options: FIELD_ZONES },
  { id: 'goalToGo', label: 'Goal-to-Go', options: ['Goal-to-Go', 'Not Goal-to-Go'] },
  { id: 'score', label: 'Score Situation', options: SCORE_BUCKETS },
  { id: 'drive', label: 'Drive Context', options: ['First Play of Drive', 'Not First Play of Drive'] },
  { id: 'explosive', label: 'Explosive-Play Context', options: ['After an Explosive Play', 'Other Snaps'] },
  { id: 'clock', label: 'Clock Situation', options: ['Two-Minute Drill', 'Other Snaps'] },
];

function customControlsHTML(side) {
  return CUSTOM_FIELDS.map((f) => `
    <div>
      <label for="cs-${side}-${f.id}">${f.label}</label>
      <select class="scout-select" id="cs-${side}-${f.id}">
        <option value="Any">Any</option>
        ${f.options.map((o) => `<option value="${o}">${o}</option>`).join('')}
      </select>
    </div>`).join('');
}

function customFilterRows(flagged, side) {
  const val = (id) => document.getElementById(`cs-${side}-${id}`).value;
  const down = val('down'), distance = val('distance'), quarter = val('quarter'), situation = val('situation'),
    fieldZone = val('fieldZone'), goalToGo = val('goalToGo'), score = val('score'), drive = val('drive'),
    explosive = val('explosive'), clock = val('clock');
  return flagged.filter((r) => {
    if (down !== 'Any' && String(r.down) !== down) return false;
    if (distance !== 'Any' && distanceBucket(r.distance) !== distance) return false;
    if (quarter !== 'Any' && r.quarter !== quarter) return false;
    if (situation !== 'Any' && r.situation !== situation) return false;
    if (fieldZone !== 'Any' && r.field_zone !== fieldZone) return false;
    if (goalToGo !== 'Any' && (goalToGo === 'Goal-to-Go') !== !!r.is_goal_to_go) return false;
    if (score !== 'Any' && scoreBucket(r.score_differential) !== score) return false;
    if (drive !== 'Any' && (drive === 'First Play of Drive') !== !!r._firstPlayOfDrive) return false;
    if (explosive !== 'Any' && (explosive === 'After an Explosive Play') !== !!r._afterExplosive) return false;
    if (clock !== 'Any' && (clock === 'Two-Minute Drill') !== !!r.is_two_minute_drill) return false;
    return true;
  });
}

function customResultLabel(side) {
  const val = (id) => document.getElementById(`cs-${side}-${id}`).value;
  // Down's own values (1/2/3/4) read as bare digits with no context outside
  // its own dropdown -- every other field's options are already
  // self-descriptive strings ("4th", "Red Zone", "Tied", ...).
  const parts = CUSTOM_FIELDS
    .map((f) => { const v = val(f.id); return v === 'Any' ? null : f.id === 'down' ? `${ordinalDown(Number(v))} Down` : v; })
    .filter((v) => v !== null);
  return parts.length ? parts.join(', ') : 'All snaps (no filters selected)';
}

function wireCustomSituation(side, flagged) {
  const controlsEl = document.getElementById(`cs-${side}-controls`);
  controlsEl.innerHTML = customControlsHTML(side);
  controlsEl.querySelectorAll('select').forEach((sel) => sel.addEventListener('change', renderResult));

  function renderResult() {
    const matched = customFilterRows(flagged, side);
    const rp = runPassRows(matched);
    document.getElementById(`cs-${side}-result`).innerHTML = rp.length
      ? `<div class="tbl-scroll">
          <table class="mini scenario-table">
            <thead><tr><th>Scenario</th><th>N</th><th>Run %</th><th>Pass %</th><th>Dir: Left %</th><th>Dir: Mid %</th><th>Dir: Right %</th><th>Depth: Deep %</th><th>Depth: Short %</th><th>1st Down %</th><th>Success %</th><th>Explosive %</th></tr></thead>
            <tbody>${scenarioRowHTML(customResultLabel(side), matched)}</tbody>
          </table>
        </div>`
      : `<div class="insight">No real Run/Pass/Sack snaps match this combination for this opponent.</div>`;
  }
  renderResult();
}

/* ---------------------------------------------------------------- report

function renderReportPage(side, allRows) {

/* ============================================================================
   SCHEME SCOUT (Defense Self Scout + Defense Scout) -- per the user:
   "make a defensive self scout section as well", then a same-day hotfix:
   "the same principle should be applied to defense" -- Offense Self Scout
   (ours) / Offense Scout (theirs) needed a defensive-side mirror too, not
   just a self-scout: Defense Self Scout (Carroll's own defensive calls) AND
   Defense Scout (the opponent's own defensive calls shown against Carroll's
   offense). Both read schematic call fields (front/blitz/movement-style),
   only charted on the hand-charted Plays sheet -- Carroll's own calls on
   defense.plays (front_d/blitz_d/movement), the opponent's on offense.plays
   (def_front/blitz/coverage, charted on Carroll's own offensive snaps,
   since that's when the opponent's defense was on the field). Neither can
   reuse the Run/Pass/Direction/Depth scenario table the Offense Self
   Scout/Offense Scout tabs use -- that breakdown doesn't exist for a
   defense's own scheme calls, only for what play type the offense ran. And
   unlike Run/Pass (2 values) or Left/Middle/Right (3), these are each a
   large open-ended vocabulary (60-90+ real distinct calls, e.g.
   "OVER"/"BEAR"/"BLACKHAWKS" for fronts) -- so the scenario table shows the
   single most-common real call per scenario ("Top X") instead of a fixed
   set of percentage columns, paired with the same Top-10-by-volume bar
   charts already established on defense.html's Defensive Line/Linebackers
   tabs (topKeysByCount + renderBar) and offense.html's own Tendencies tab
   (which already surfaces the opponent's def_front/coverage the same way).
   6 scenario dimensions (Down/Distance/Situation/Field Zone/Play Type/Hash)
   exist on either tab, not the official-play-by-play tabs' 10 --
   Quarter/Goal-to-Go/Score Situation/Drive Context/Explosive-Play Context
   are all official-only fields that don't exist on the hand-charted Plays
   sheet (no quarter, no goal-to-go flag, no score_differential, no
   drive_num on either offense.plays or defense.plays -- a real structural
   gap, not an oversight). Play Type and Hash, added 2026-08-04 per the
   user ("the custom situation for defense has way less options than
   offense"), DO exist on both sheets (play_type: Run/Pass/Timeout/Unknown,
   hash: L/M/R, ~78-80% filled) and were simply unused until now --
   Timeout/Unknown are excluded from Play Type's real values the same way
   Kneel/Two-Point Conversion are excluded from the official tabs' Run/Pass
   split.

   One shared, parameter-driven schemeScoutTab() renders both -- per this
   project's established convention (see js/charts.js's own hoisting
   comments), whole tab-renderer functions stay separate per tab, but the
   pure logic underneath is shared. Only what differs between the two
   (data source, field names/labels, title/note/footer text) is config.
   ============================================================================ */

// '-' is the source sheet's own "charted, but nothing called" placeholder --
// excluded from "real call" everywhere below, same convention defense.html's
// existing Tendencies/Defensive Line tabs already use for these same fields.
function schemeRealRows(rows, field) {
  return rows.filter((r) => r[field] && r[field] !== '-');
}

function schemeModalCellHTML(rows, field) {
  const real = schemeRealRows(rows, field);
  if (!real.length) return '—';
  const byVal = groupBy(real, field);
  const top = topKeysByCount(byVal, 1)[0];
  return `${top} <span class="modal-pct">(${pct(byVal.get(top).length / real.length, 0)})</span>`;
}

// 'Timeout'/'Unknown' are the hand-charted sheet's own non-snap play_type
// values (a timeout, or a play the charter couldn't classify) -- not real
// scenario buckets, same exclusion logic as the official tabs' Run/Pass
// split dropping Kneel/Two-Point Conversion.
const SCHEME_PLAY_TYPES = ['Run', 'Pass'];
const PLAY_HASH = ['L', 'M', 'R'];

function schemeScenarios(rows) {
  const withDist = rows.map((r) => ({ ...r, _db: distanceBucket(r.distance) }));
  return [
    { title: 'By Down', items: DOWNS.map((d) => ({ label: `${ordinalDown(d)} Down`, rows: rows.filter((r) => r.down === d) })) },
    { title: 'By Distance', items: DIST_BUCKETS.map((b) => ({ label: `${b} yds to go`, rows: withDist.filter((r) => r._db === b) })) },
    { title: 'By Situation', items: SITUATIONS.map((s) => ({ label: s, rows: rows.filter((r) => r.situation === s) })) },
    { title: 'By Field Zone', items: FIELD_ZONES.map((z) => ({ label: z, rows: rows.filter((r) => r.field_zone === z) })) },
    { title: 'By Play Type', items: SCHEME_PLAY_TYPES.map((t) => ({ label: t, rows: rows.filter((r) => r.play_type === t) })) },
    { title: 'By Hash', items: PLAY_HASH.map((h) => ({ label: h, rows: rows.filter((r) => r.hash === h) })) },
  ];
}

function schemeTableHeadHTML(fields) {
  return `<tr><th>Scenario</th><th>N</th>${fields.map((f) => `<th>Top ${f.label}</th>`).join('')}<th>Success %</th><th>Explosive %</th></tr>`;
}

// Success/Explosive % added 2026-08-05, per the user ("add some more
// percentages... any other percentages you think would be useful"). Uses
// play_efficiency, a systematically-computed field present on the
// hand-charted Plays sheet too (not the inconsistent "1st DN" free-text
// tag scenarioRowHTML's own comment explains -- that one's why First Down %
// is NOT added here, only on the official-play-by-play report tabs).
function schemeScenarioRowHTML(label, rows, fields) {
  const successN = rows.filter((r) => isSuccess(r.play_efficiency)).length;
  const explosiveN = rows.filter((r) => r.play_efficiency === 'Explosive').length;
  return `<tr>
    <td class="name">${label}</td>
    <td>${rows.length}</td>
    ${fields.map((f) => `<td>${schemeModalCellHTML(rows, f.key)}</td>`).join('')}
    <td>${pct(rows.length ? successN / rows.length : null, 0)}</td>
    <td>${pct(rows.length ? explosiveN / rows.length : null, 0)}</td>
  </tr>`;
}

function renderSchemeScenarioTable(containerId, rows, fields) {
  const sections = schemeScenarios(rows);
  let rowsHTML = '';
  sections.forEach((sec) => {
    const items = sec.items.filter((it) => it.rows.length > 0);
    if (!items.length) return;
    rowsHTML += sectionRowHTML(sec.title, 4 + fields.length);
    items.forEach((it) => { rowsHTML += schemeScenarioRowHTML(it.label, it.rows, fields); });
  });
  // Same fix as renderScenarioTable() -- a single-season opponent with that
  // season unchecked (or "None" on the Season filter) is a normal path
  // through the new filter, not an edge case; show the same empty-state
  // message wireSchemeCustomSituation() already had instead of a bare table.
  if (!rowsHTML) {
    document.getElementById(containerId).innerHTML = '<div class="insight">No charted snaps match the selected opponent(s)/season(s).</div>';
    return;
  }
  document.getElementById(containerId).innerHTML = `
    <div class="tbl-scroll">
      <table class="mini scenario-table">
        <thead>${schemeTableHeadHTML(fields)}</thead>
        <tbody>${rowsHTML}</tbody>
      </table>
    </div>`;
}

const SCHEME_CHART_COLORS = ['--cat-2', '--cat-7', '--cat-5'];

function renderSchemeCharts(side, rows, fields) {
  fields.forEach((f, i) => {
    const byVal = groupBy(schemeRealRows(rows, f.key), f.key);
    const cats = topKeysByCount(byVal, 10);
    renderBar(document.getElementById(`${side}-chart-${i}`), {
      categories: cats, values: cats.map((v) => byVal.get(v).length),
      labelFmt: (v) => String(v), colorFn: () => cssVar(SCHEME_CHART_COLORS[i % SCHEME_CHART_COLORS.length]),
      tooltipExtra: (v) => `${byVal.get(v).length} snaps`,
    });
  });
}

const SCHEME_CUSTOM_FIELDS = [
  { id: 'down', label: 'Down', options: DOWNS.map(String) },
  { id: 'distance', label: 'Distance', options: DIST_BUCKETS },
  { id: 'situation', label: 'Situation', options: SITUATIONS },
  { id: 'fieldZone', label: 'Field Zone', options: FIELD_ZONES },
  { id: 'playType', label: 'Play Type', options: SCHEME_PLAY_TYPES },
  { id: 'hash', label: 'Hash', options: PLAY_HASH },
];

function schemeCustomControlsHTML(side) {
  return SCHEME_CUSTOM_FIELDS.map((f) => `
    <div>
      <label for="${side}-cs-${f.id}">${f.label}</label>
      <select class="scout-select" id="${side}-cs-${f.id}">
        <option value="Any">Any</option>
        ${f.options.map((o) => `<option value="${o}">${o}</option>`).join('')}
      </select>
    </div>`).join('');
}

function schemeCustomFilterRows(side, rows) {
  const val = (id) => document.getElementById(`${side}-cs-${id}`).value;
  const down = val('down'), distance = val('distance'), situation = val('situation'), fieldZone = val('fieldZone'),
    playType = val('playType'), hash = val('hash');

    if (down !== 'Any' && String(r.down) !== down) return false;

    if (fieldZone !== 'Any' && r.field_zone !== fieldZone) return false;
    if (playType !== 'Any' && r.play_type !== playType) return false;
    if (hash !== 'Any' && r.hash !== hash) return false;
    return true;
  });
}

function schemeCustomLabel(side) {
  const val = (id) => document.getElementById(`${side}-cs-${id}`).value;
  const parts = SCHEME_CUSTOM_FIELDS
    .map((f) => {
      const v = val(f.id);
      if (v === 'Any') return null;

      if (f.id === 'hash') return `${v} Hash`;
      return v;
    })
    .filter((v) => v !== null);
  return parts.length ? parts.join(', ') : 'All snaps (no filters selected)';
}

function wireSchemeCustomSituation(side, rows, fields) {
  const controlsEl = document.getElementById(`${side}-cs-controls`);
  controlsEl.innerHTML = schemeCustomControlsHTML(side);
  controlsEl.querySelectorAll('select').forEach((sel) => sel.addEventListener('change', renderResult));

  function renderResult() {

    document.getElementById(`${side}-cs-result`).innerHTML = matched.length
      ? `<div class="tbl-scroll">
          <table class="mini scenario-table">
            <thead>${schemeTableHeadHTML(fields)}</thead>
            <tbody>${schemeScenarioRowHTML(schemeCustomLabel(side), matched, fields)}</tbody>
          </table>
        </div>`
      : '<div class="insight">No charted snaps match this combination for this opponent.</div>';
  }
  renderResult();
}

          <div class="kpirow" id="${side}-kpis">
            ${kpiHTML(`${side}-n`, 'Snaps (Charted)')}
            ${kpiHTML(`${side}-blitzrate`, 'Blitz Rate')}
            ${kpiHTML(`${side}-topfield`, kpiExtraLabel)}
            ${kpiHTML(`${side}-games`, 'Games')}
          </div>
          <div class="insight" style="margin-bottom:10px;">${note}</div>
          <div class="card" style="margin-bottom:14px;">
            <div class="card-head"><h3>Most-Used Call by Scenario</h3></div>
            <div class="card-body">
              <div id="${side}-table"></div>
              <div class="data-note">Top ${fields.map((f) => f.label).join('/')} is the single most-common real call charted for that scenario, with its share of that scenario's charted snaps for that field — "—" means nothing was charted for that field in that scenario, not that nothing was ever called. Success/Explosive % are of every charted snap in that scenario (the N column).</div>
            </div>
          </div>
          <div class="chartgrid">
            <div class="card"><div class="card-head"><h3>${fields[0].chartTitle}</h3></div><div class="card-body" id="${side}-chart-0"></div></div>
            <div class="card"><div class="card-head"><h3>${fields[1].chartTitle}</h3></div><div class="card-body" id="${side}-chart-1"></div></div>
          </div>
          <div class="card" style="margin-bottom:14px;">
            <div class="card-head"><h3>${fields[2].chartTitle}</h3></div>
            <div class="card-body" id="${side}-chart-2"></div>
          </div>
          <div class="card">
            <div class="card-head"><h3>Custom Situation</h3></div>
            <div class="card-body">
              <div class="custom-situation-grid no-print" id="${side}-cs-controls"></div>
              <div id="${side}-cs-result"></div>
              <div class="data-note">Combines every selection above with AND — leave a dropdown on "Any" to ignore that dimension.</div>
            </div>
          </div>
        </div>
        <div class="footer-note">Source: Game Analysis's Plays sheet, combined_play_data.xlsx. ${footerNote}</div>
      </div>
    </div>`;

  document.getElementById(`${side}-shelf`).innerHTML = buildFilterPanel(side, YEAR_FILTERS, { season: DATA.filters.offense.season });
  wireFilterPanel(side, YEAR_FILTERS, render);

  document.getElementById(`${side}-opponent`).addEventListener('change', render);
  document.getElementById(`${side}-pdf`).addEventListener('click', () => {
    const opponent = document.getElementById(`${side}-opponent`).value;
    const label = opponent === ALL_OPPONENTS ? ALL_OPPONENTS_LABEL : opponent;
    printPage(`Opponent Scouting - ${title} - ${label} - Carroll Football`);
  });

  function render() {
    const opponent = document.getElementById(`${side}-opponent`).value;
    const seasonSet = readFilterState(side, YEAR_FILTERS).season;
    const rows = filterByOpponentSeason(sourceRows, opponent, seasonSet);
    const games = new Set(rows.map((r) => r.game_label));
    const blitzField = fields[1].key;
    const byFieldAll = groupBy(schemeRealRows(rows, fields[0].key), fields[0].key);
    const topFieldAll = topKeysByCount(byFieldAll, 1)[0];

    setKPI(`${side}-n`, String(rows.length));
    // Real bug found building this: defense.plays' blitz_d uses "-" as its own
    // "charted, nothing called" placeholder (so "rate among rows where the
    // field isn't blank" is the real blitz rate), but offense.plays' blitz
    // (the opponent's blitz shown to Carroll's O) has NO such placeholder --
    // "-" never appears in that column at all, so that same formula would
    // always compute 100% (every row where the field isn't blank already IS
    // a real blitz name by construction, nothing to divide out). blitzUsesDash
    // switches between the two real conventions instead of assuming they match.
    if (config.blitzUsesDash) {
      const blitzCharted = rows.filter((r) => r[blitzField] !== null && r[blitzField] !== undefined);
      setKPI(`${side}-blitzrate`, blitzCharted.length ? pct(rate(blitzCharted, (r) => r[blitzField] !== '-')) : '—', `${blitzCharted.length} charted`);
    } else {
      setKPI(`${side}-blitzrate`, rows.length ? pct(rate(rows, (r) => r[blitzField] && r[blitzField] !== '-')) : '—', `${rows.length} snaps in view`);
    }
    setKPI(`${side}-topfield`, topFieldAll || '—', topFieldAll ? `${byFieldAll.get(topFieldAll).length} snaps` : '');
    setKPI(`${side}-games`, String(games.size));

    renderSchemeScenarioTable(`${side}-table`, rows, fields);
    renderSchemeCharts(side, rows, fields);
    wireSchemeCustomSituation(side, rows, fields);
  }
  render();
}

function defenseSelfScoutTab(root) {
  schemeScoutTab(root, {
    side: 'dss',
    title: 'Defense Self Scout',
    note: "Carroll's own defensive scheme calls (front, blitz, movement) against the selected opponent(s) — the other tabs cover play type (run/pass); this one covers Carroll's own call.",
    sourceRows: DATA.defense.plays,
    fields: [
      { key: 'front_d', label: 'Front', chartTitle: 'Fronts Used (top 10 by volume)' },
      { key: 'blitz_d', label: 'Blitz', chartTitle: 'Blitzes Called (top 10 by volume)' },
      { key: 'movement', label: 'Movement', chartTitle: 'Movement/Stunt Called (top 10 by volume)' },
    ],
    kpiExtraLabel: 'Most-Used Front',
    footerNote: "Front/blitz/movement names are Carroll's own playbook call vocabulary, shown exactly as charted.",
    blitzUsesDash: true,
  });
}

function defenseScoutTab(root) {
  schemeScoutTab(root, {
    side: 'dsc',
    title: 'Defense Scout',
    note: "The selected opponent(s)' own defensive scheme calls (front, blitz, coverage) shown against Carroll's offense — real scouting signal if they're on a future schedule again.",
    sourceRows: DATA.offense.plays,
    fields: [
      { key: 'def_front', label: 'Front', chartTitle: 'Fronts Shown (top 10 by volume)' },
      { key: 'blitz', label: 'Blitz', chartTitle: 'Blitzes Shown (top 10 by volume)' },
      { key: 'coverage', label: 'Coverage', chartTitle: 'Coverage Shown (top 10 by volume)' },
    ],
    kpiExtraLabel: 'Most-Used Front',
    footerNote: "Front/blitz/coverage names are as charted by Carroll's own staff watching this opponent's defense, not that opponent's own internal terminology.",
    blitzUsesDash: false,
  });
}

const TAB_RENDERERS = {
  by_opponent: (root) => byOpponentTab(root),
  offense_self_scout: (root) => offenseSelfScoutTab(root),
  offense_scout: (root) => offenseScoutTab(root),
  defense_self_scout: (root) => defenseSelfScoutTab(root),
  defense_scout: (root) => defenseScoutTab(root),
};

function showTab(tab) {
  document.querySelectorAll('#os-tabs .tabbtn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  TAB_RENDERERS[tab](document.getElementById('os-stage'));
}

document.querySelectorAll('#os-tabs .tabbtn').forEach((btn) => {
  btn.addEventListener('click', () => showTab(btn.dataset.tab));
});

fetch('../data/game-data.json')
  .then((r) => r.json())
  .then((data) => {
    DATA = data;
    showTab('by_opponent');
  })
  .catch((err) => {
    document.getElementById('os-stage').innerHTML = `<div class="card"><div class="card-body">Couldn't load data/game-data.json — ${err}. Run scripts/build_game_data.py first, and serve over http:// not file://.</div></div>`;
  });
</script>
</body>
</html>
